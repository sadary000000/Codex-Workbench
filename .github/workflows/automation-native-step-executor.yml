name: Automation Native Step Executor Gate

on:
  push:
    branches:
      - feature/automation-native-step-executor

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff guard
        shell: bash
        run: |
          set -euo pipefail
          base='0baf6d1aadb2b64926d9a9867ce3ac9cbc161432'
          allowed='^(src/automation/step-execution-service\.ts|src/automation/provider-service-router\.ts|src/main/automation-execution-facade\.ts|tests/automation-native-step-executor\.test\.ts|\.github/workflows/automation-native-step-executor\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded Native Step Executor slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in \
            src/automation/step-execution-service.ts \
            src/automation/provider-service-router.ts \
            src/main/automation-execution-facade.ts \
            tests/automation-native-step-executor.test.ts; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required diff: $required" >&2; exit 1; }
          done

      - name: Apply exact receipt input type fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/automation/step-execution-service.ts')
          text = path.read_text()
          old_decl = '    const receiptInput = {\n      actionAttemptId: input.actionAttempt.actionAttemptId,'
          new_decl = '    const receiptInput: Parameters<AutomationStore["createActionReceipt"]>[0] = {\n      actionAttemptId: input.actionAttempt.actionAttemptId,'
          old_end = '      evidenceRefs: [],\n    } as const;\n    if (existing?.status === "UNKNOWN") return this.store.reconcileActionReceipt(receiptInput);'
          new_end = '      evidenceRefs: [],\n    };\n    if (existing?.status === "UNKNOWN") return this.store.reconcileActionReceipt(receiptInput);'
          if text.count(old_decl) != 1 or text.count(old_end) != 1:
              raise SystemExit('exact receipt input patch anchor mismatch')
          path.write_text(text.replace(old_decl, new_decl).replace(old_end, new_end))
          PY
          git diff --check
          git diff -- src/automation/step-execution-service.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Native Step Executor tests
        run: node --experimental-strip-types --test tests/automation-native-step-executor.test.ts tests/automation-execution-verification-boundary.test.ts tests/arch-r2-native-provider.test.ts tests/arch-r2-provider-policy-authority.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated fix and self-clean workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/automation/step-execution-service.ts
          git rm .github/workflows/automation-native-step-executor.yml
          git commit -m 'fix: type Native Step receipt input'
          git push origin HEAD:feature/automation-native-step-executor
