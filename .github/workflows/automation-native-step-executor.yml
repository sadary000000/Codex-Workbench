name: Automation Native Step Executor Gate

on:
  push:
    branches:
      - feature/automation-native-step-executor

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff guard
        shell: bash
        run: |
          set -euo pipefail
          base='0baf6d1aadb2b64926d9a9867ce3ac9cbc161432'
          allowed='^(src/automation/step-execution-service\.ts|src/automation/provider-service-router\.ts|src/main/automation-execution-facade\.ts|tests/automation-native-step-executor\.test\.ts|\.github/workflows/automation-native-step-executor\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded Native Step Executor slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in \
            src/automation/step-execution-service.ts \
            src/automation/provider-service-router.ts \
            src/main/automation-execution-facade.ts \
            tests/automation-native-step-executor.test.ts; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required diff: $required" >&2; exit 1; }
          done

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Native Step Executor tests
        run: node --experimental-strip-types --test tests/automation-native-step-executor.test.ts tests/automation-execution-verification-boundary.test.ts tests/arch-r2-native-provider.test.ts tests/arch-r2-provider-policy-authority.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Self-clean validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-native-step-executor.yml
          git commit -m 'test: remove Native Step Executor gate'
          git push origin HEAD:feature/automation-native-step-executor
