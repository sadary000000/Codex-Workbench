name: Automation Stage Progression

on:
  push:
    branches:
      - feature/automation-stage-progression

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff and Stage progression boundary guard
        shell: bash
        run: |
          set -euo pipefail
          base='9be5cf73f2c68ea077c4406fd0ff6c2dc54fca72'
          allowed='^(src/automation/stage-progression-service\.ts|src/main/automation-execution-facade\.ts|tests/automation-stage-progression\.test\.ts|\.github/workflows/automation-stage-progression\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded Stage progression slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in src/automation/stage-progression-service.ts src/main/automation-execution-facade.ts tests/automation-stage-progression.test.ts .github/workflows/automation-stage-progression.yml; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required Stage progression diff: $required" >&2; exit 1; }
          done
          if grep -Eq 'from "\./(adapters|effective-policy|provider-policy-authority|provider-service-router)\.ts"|from "\.\./.*codex/|REQUIRE_HUMAN_GATE|startTurn\(|\.submit\(|child_process|spawn\(|exec\(|createPlanVersion\(|replace\("planVersions"' src/automation/stage-progression-service.ts; then
            echo 'Stage progression must remain workflow-truth/checkpoint-only and must not dispatch work or rewrite PlanVersion.' >&2
            exit 1
          fi
          grep -F 'this.store.createCheckpoint' src/automation/stage-progression-service.ts >/dev/null
          grep -F 'existing = document.checkpoints.find' src/automation/stage-progression-service.ts >/dev/null
          grep -F '? previous.currentStageSpecId' src/automation/stage-progression-service.ts >/dev/null
          grep -F 'gate.sha256 !== sha256Hex(descriptor)' src/automation/stage-progression-service.ts >/dev/null
          grep -F '"PLAN_COMPLETE_READY"' src/automation/stage-progression-service.ts >/dev/null
          grep -F 'without mutating immutable PlanVersion' tests/automation-stage-progression.test.ts >/dev/null
          grep -F 'without auto-completing the Project' tests/automation-stage-progression.test.ts >/dev/null
          git diff --check "$base"...HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Stage progression governance tests
        run: node --experimental-strip-types --test tests/automation-stage-progression.test.ts tests/automation-stage-gate.test.ts tests/automation-step-review-completion.test.ts tests/automation-step-verifier.test.ts tests/automation-native-step-executor.test.ts tests/automation-step-verification-contract.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Self-clean validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-stage-progression.yml
          git commit -m 'test: remove Stage progression validation workflow'
          git push origin HEAD:feature/automation-stage-progression
