name: V0.1 governance eligibility repair runner

on:
  push:
    branches:
      - fix/v01-governance-eligibility-v2
    paths:
      - .github/workflows/v01-governance-eligibility-diagnostics.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v01-governance-eligibility-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply projection and renderer anchors
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = "src/automation/governance-projection-service.ts"
          replace_once(path, 'import { v01StepSideEffectCapability } from "./v01-effective-capability.ts";', 'import { v01StepSideEffectCapability, v01StepVerificationCapability } from "./v01-effective-capability.ts";')
          replace_once(path, '  readonly sideEffectClass: StepSpec["sideEffectClass"];\n  readonly hasReconcileTruth: boolean;', '  readonly sideEffectClass: StepSpec["sideEffectClass"];\n  readonly verifier: ReturnType<typeof v01StepVerificationCapability>;\n  readonly hasReconcileTruth: boolean;')
          replace_once(path, '  const execute = input.isCurrentStage && input.hasPolicy && sideEffect.allowed && freshRuntime && !input.attempt;', '  const execute = input.isCurrentStage && input.hasPolicy && sideEffect.allowed && input.verifier.allowed && freshRuntime && !input.attempt;')
          replace_once(path, '  const verify = Boolean(\n    input.attempt\n    && input.runtime?.lifecycle === "VERIFYING"', '  const verify = Boolean(\n    input.verifier.allowed\n    && input.attempt\n    && input.runtime?.lifecycle === "VERIFYING"')
          replace_once(path, '  const executeReason = !sideEffect.allowed\n    ? sideEffect.reason\n    : !input.hasPolicy\n      ? "Execute requires the Project current PolicyVersion."\n      : "Only a fresh NOT_STARTED/READY Step in the current Stage can start.";', '  const executeReason = !sideEffect.allowed\n    ? sideEffect.reason\n    : !input.verifier.allowed\n      ? input.verifier.reason\n      : !input.hasPolicy\n        ? "Execute requires the Project current PolicyVersion."\n        : "Only a fresh NOT_STARTED/READY Step in the current Stage can start.";')
          replace_once(path, '    verify: eligibility(verify, "Verify requires one terminal-successful ExecutionAttempt in VERIFYING with no verification Evidence yet."),', '    verify: eligibility(verify, input.verifier.allowed\n      ? "Verify requires one terminal-successful ExecutionAttempt in VERIFYING with no verification Evidence yet."\n      : input.verifier.reason),')
          replace_once(path, '            sideEffectClass: step.sideEffectClass,\n            hasReconcileTruth:', '            sideEffectClass: step.sideEffectClass,\n            verifier: v01StepVerificationCapability(step),\n            hasReconcileTruth:')

          path = "src/renderer/automation-governance-actions.ts"
          replace_once(path, '按钮可用性来自后端 Governance Projection；Renderer 只展示投影并在对应 Project / Stage / Step 卡片内显示操作结果。后端执行命令时仍会重新校验 workflow truth。Fresh Execute 仍要求用户显式选择当前 Runtime Truth 中的 exact Native Thread。', '按钮可用性来自后端 Governance Projection；Renderer 只展示投影并在对应 Project / Stage / Step 卡片内显示操作结果。每个 command 都由后端重新校验 workflow truth。Fresh Execute 仍要求用户显式选择当前 Runtime Truth 中的 exact Native Thread。')
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated product patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automation/governance-projection-service.ts src/renderer/automation-governance-actions.ts
          git commit -m "fix: project verifier capability into governance eligibility"
          git push origin HEAD:fix/v01-governance-eligibility-v2
