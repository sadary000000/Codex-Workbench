name: ARCH-R4 Native Policy Budget Patch

on:
  push:
    branches:
      - arch-r4/native-policy-budget-durability

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: "${{ github.event.head_commit.message == 'ARCH-R4: execute native policy budget durability patch' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded ProviderPolicyAuthority patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/automation/provider-policy-authority.ts')
          raw = path.read_bytes()
          newline = b'\r\n' if b'\r\n' in raw else b'\n'

          old = newline.join([
              b'      const budgetCorrelation = input.correlation.actionAttemptId ?? correlationId;',
              b'      const reservation = authority.reserve(budgetKind, budgetCorrelation);',
          ])
          new = newline.join([
              b'      const budgetCorrelation = input.correlation.actionAttemptId ?? correlationId;',
              b'      await this.claimDurableBudget({',
              b'        projectId,',
              b'        policyVersionId,',
              b'        budgetKind,',
              b'        correlationId: budgetCorrelation,',
              b'        limit: decision.effectivePolicy.budgets[budgetKind],',
              b'      });',
              b'      const reservation = authority.reserve(budgetKind, budgetCorrelation);',
          ])
          if raw.count(old) != 1:
              raise SystemExit(f'expected exactly one budget reservation boundary, found {raw.count(old)}')
          raw = raw.replace(old, new, 1)

          anchor = newline.join([
              b'  snapshot(policyVersionId: string) {',
              b'    return this.budgets.get(policyVersionId)?.snapshot() ?? null;',
              b'  }',
          ])
          method = newline.join([
              b'  private async claimDurableBudget(input: {',
              b'    readonly projectId: string;',
              b'    readonly policyVersionId: string;',
              b'    readonly budgetKind: BudgetKind;',
              b'    readonly correlationId: string;',
              b'    readonly limit: number;',
              b'  }): Promise<void> {',
              b'    await this.store.transaction((tx) => {',
              b'      const committed = tx.table("auditEvents").filter((event) =>',
              b'        event.projectId === input.projectId',
              b'        && event.entityType === "PolicyVersion"',
              b'        && event.entityId === input.policyVersionId',
              b'        && event.eventType === "POLICY_BUDGET_COMMITTED"',
              b'        && event.boundedPayload.budgetKind === input.budgetKind,',
              b'      );',
              b'      if (committed.some((event) => event.correlationId === input.correlationId)) {',
              b'        throw new ProviderPolicyAuthorityError("POLICY_BUDGET_DENIED", `Provider ${input.budgetKind} budget correlation was already committed.`, { policyVersionId: input.policyVersionId, budgetKind: input.budgetKind, correlationId: input.correlationId, remaining: Math.max(0, input.limit - committed.length) });',
              b'      }',
              b'      if (committed.length >= input.limit) {',
              b'        throw new ProviderPolicyAuthorityError("POLICY_BUDGET_EXHAUSTED", `Provider ${input.budgetKind} budget is exhausted for the pinned PolicyVersion.`, { policyVersionId: input.policyVersionId, budgetKind: input.budgetKind, correlationId: input.correlationId, remaining: 0 });',
              b'      }',
              b'      tx.appendAudit({',
              b'        projectId: input.projectId,',
              b'        entityType: "PolicyVersion",',
              b'        entityId: input.policyVersionId,',
              b'        eventType: "POLICY_BUDGET_COMMITTED",',
              b'        actorType: "AUTOMATION",',
              b'        actorRef: null,',
              b'        boundedPayload: { budgetKind: input.budgetKind, effectiveBudget: input.limit },',
              b'        correlationId: input.correlationId,',
              b'        causationId: null,',
              b'      });',
              b'    });',
              b'  }',
              b'',
              anchor,
          ])
          if raw.count(anchor) != 1:
              raise SystemExit(f'expected exactly one snapshot anchor, found {raw.count(anchor)}')
          raw = raw.replace(anchor, method, 1)
          path.write_bytes(raw)
          PY

      - name: Enforce bounded source diff
        shell: bash
        run: |
          git diff --check
          git diff --numstat -- src/automation/provider-policy-authority.ts
          changed=$(git diff --numstat -- src/automation/provider-policy-authority.ts | awk '{print $1+$2}')
          test "${changed:-999}" -le 55
          git diff -- src/automation/provider-policy-authority.ts | grep -F 'POLICY_BUDGET_COMMITTED' >/dev/null
          git diff -- src/automation/provider-policy-authority.ts | grep -F 'claimDurableBudget' >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: R4 restart regression
        run: node --experimental-strip-types --test tests/arch-r4-native-policy-budget-durability.test.ts

      - name: Existing provider policy regression
        run: node --experimental-strip-types --test tests/arch-r2-provider-policy-authority.test.ts

      - name: Full unit and integration suite
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/automation/provider-policy-authority.ts
          git commit -m 'ARCH-R4: persist native policy budget commitments'
          git push origin HEAD:arch-r4/native-policy-budget-durability
