name: One-time branch cleanup

on:
  push:
    branches:
      - fix/v01-recovery-closure

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: fix/v01-recovery-closure
          fetch-depth: 0

      - name: Archive historical test results and delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          archive_tag='archive/codex-test-results-20260903'
          archive_stage='archive-stage/codex-test-results-20260903'
          expected_sha='f5afa66b7313b35afa818bd3c0f89616c711e78a'
          stage_sha="$(git rev-parse "refs/remotes/origin/$archive_stage")"
          if [ "$stage_sha" != "$expected_sha" ]; then
            echo "archive stage moved: expected $expected_sha, got $stage_sha" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$archive_tag" >/dev/null 2>&1; then
            tag_sha="$(git ls-remote --tags origin "refs/tags/$archive_tag" | awk '{print $1}')"
            if [ "$tag_sha" != "$expected_sha" ]; then
              echo "archive tag exists at unexpected SHA: $tag_sha" >&2
              exit 1
            fi
          else
            git tag "$archive_tag" "$expected_sha"
            git push origin "refs/tags/$archive_tag"
          fi

          branches=(
            'archive-stage/codex-test-results-20260903'
            'chore/rebind-native-ab-after-windows-fix'
            'chore/rebind-native-ab-protocol-v1-1-clean'
            'chore/rebind-native-ab-v1-2-clean'
            'docs/automation-governance-checkpoint'
            'feature/ab-native-parity-validation'
            'feature/automation-deterministic-verifier'
            'feature/automation-execution-to-verification'
            'feature/automation-governance-action-controls'
            'feature/automation-governance-control-plane'
            'feature/automation-governance-dispatch'
            'feature/automation-governance-inspector-ui-mainline'
            'feature/automation-governance-preload'
            'feature/automation-governance-projection'
            'feature/automation-governance-read-surface'
            'feature/automation-native-step-executor'
            'feature/automation-native-target-execute'
            'feature/automation-project-completion'
            'feature/automation-provider-orchestration-preload'
            'feature/automation-requirement-confirm-surface'
            'feature/automation-requirement-planner-ui'
            'feature/automation-requirement-review-projection'
            'feature/automation-stage-gate'
            'feature/automation-stage-progression'
            'feature/automation-step-review-completion'
            'feature/automation-step-verification-contract'
            'feature/automation-step-verifier'
            'feature/r7-map-entity-references'
            'feature/r7-product-automation-association'
            'feature/r7-project-automation-association-ui'
            'feature/r7-project-map-governance-references'
            'feature/r7-project-map-scope-references'
            'feature/r8-remove-map-maintenance-runtime'
            'feature/r8-remove-project-map-compat-runtime'
            'feature/r8-remove-unreachable-map-runtime'
            'feature/r8-share-project-map-thread-reads'
            'fix/windows-layout-contract-crlf'
            'test/native-ab-protocol-v1-1-clean'
            'test/native-ab-unresolved-v1-2-clean'
          )

          for branch in "${branches[@]}"; do
            case "$branch" in
              main|codex/workbench-v1|workbench/next|release/v0.1-integration|fix/v01-recovery-closure)
                echo "Refusing to delete protected keep branch: $branch" >&2
                exit 1
                ;;
            esac
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout fix/v01-recovery-closure
          git pull --ff-only origin fix/v01-recovery-closure
          if [ -f .github/workflows/one-time-branch-cleanup.yml ]; then
            git rm .github/workflows/one-time-branch-cleanup.yml
            git commit -m "chore: remove one-time branch cleanup workflow"
            git push origin HEAD:fix/v01-recovery-closure
          fi
