name: Automation governance control-plane gate

on:
  push:
    branches:
      - feature/automation-governance-control-plane

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded control-plane patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          contract = "src/shared/webgpt-control-plane-contract.ts"
          replace_once(
              contract,
              '  { name: "automation.planner", status: "STABLE", description: "Provider-neutral Planner lifecycle; new work defaults to Native and recovery preserves persisted provider identity." },\n  { name: "webgpt.review-submit",',
              '  { name: "automation.planner", status: "STABLE", description: "Provider-neutral Planner lifecycle; new work defaults to Native and recovery preserves persisted provider identity." },\n  { name: "automation.step", status: "STABLE", description: "Provider-neutral Step execution, reconciliation, verification, and explicit user review lifecycle." },\n  { name: "automation.stage", status: "STABLE", description: "Provider-neutral Stage gate and progression lifecycle." },\n  { name: "automation.project", status: "STABLE", description: "Provider-neutral Automation Project completion projection." },\n  { name: "webgpt.review-submit",',
          )
          replace_once(
              contract,
              '  "automation.planner.result",\n] as const;',
              '  "automation.planner.result",\n  "automation.step.execute",\n  "automation.step.reconcile",\n  "automation.step.verify",\n  "automation.step.review",\n  "automation.stage.gate",\n  "automation.stage.advance",\n  "automation.project.complete",\n] as const;',
          )
          replace_once(
              contract,
              '  "automation.planner.result": "automation.planner",\n});',
              '  "automation.planner.result": "automation.planner",\n  "automation.step.execute": "automation.step",\n  "automation.step.reconcile": "automation.step",\n  "automation.step.verify": "automation.step",\n  "automation.step.review": "automation.step",\n  "automation.stage.gate": "automation.stage",\n  "automation.stage.advance": "automation.stage",\n  "automation.project.complete": "automation.project",\n});',
          )
          replace_once(
              contract,
              '          projectId: { type: "string", maxLength: 256 },\n          role:',
              '          projectId: { type: "string", maxLength: 256 },\n          stepSpecId: { type: "string", minLength: 1, maxLength: 256 },\n          executionAttemptId: { type: "string", minLength: 1, maxLength: 256 },\n          stageSpecId: { type: "string", minLength: 1, maxLength: 256 },\n          reviewDecision: { type: "string", enum: ["APPROVE", "REJECT"] },\n          reviewerRef: { type: "string", minLength: 1, maxLength: 256 },\n          stageGateDecision: { type: "string", enum: ["PASS", "REJECT"] },\n          gatekeeperRef: { type: "string", minLength: 1, maxLength: 256 },\n          role:',
          )

          parser = "src/main/webgpt-control.ts"
          replace_once(
              parser,
              '  policyVersionId?: string;\n}',
              '  policyVersionId?: string;\n  stepSpecId?: string;\n  executionAttemptId?: string;\n  stageSpecId?: string;\n  reviewDecision?: "APPROVE" | "REJECT";\n  reviewerRef?: string;\n  stageGateDecision?: "PASS" | "REJECT";\n  gatekeeperRef?: string;\n}',
          )
          replace_once(
              parser,
              '  if (record.operation !== undefined && record.operation !== "PLAN_REQUIREMENT" && record.operation !== "DETAIL_STAGE") return controlError("PLANNER_OPERATION_INVALID", "Planner operation is invalid.", record.command, requestId);',
              '  for (const field of ["stepSpecId", "executionAttemptId", "stageSpecId", "reviewerRef", "gatekeeperRef"] as const) {\n    const value = record[field];\n    if (value !== undefined && (typeof value !== "string" || !value.trim() || value.length > 256)) return controlError("AUTOMATION_GOVERNANCE_FIELD_INVALID", `Automation governance field ${field} is invalid.`, record.command, requestId);\n  }\n  if (record.reviewDecision !== undefined && record.reviewDecision !== "APPROVE" && record.reviewDecision !== "REJECT") return controlError("STEP_REVIEW_DECISION_INVALID", "Step review decision must be APPROVE or REJECT.", record.command, requestId);\n  if (record.stageGateDecision !== undefined && record.stageGateDecision !== "PASS" && record.stageGateDecision !== "REJECT") return controlError("STAGE_GATE_DECISION_INVALID", "Stage gate decision must be PASS or REJECT.", record.command, requestId);\n  if (record.operation !== undefined && record.operation !== "PLAN_REQUIREMENT" && record.operation !== "DETAIL_STAGE") return controlError("PLANNER_OPERATION_INVALID", "Planner operation is invalid.", record.command, requestId);',
          )
          replace_once(
              parser,
              '  if ((command === "webgpt.requirement.reconcile" || command === "automation.requirement.reconcile") && typeof record.requirementSessionId !== "string") return controlError("REQUIREMENT_SESSION_REQUIRED", "requirement reconcile 必须提供 sessionId。", command, requestId);\n  if (["webgpt.project.inspect",',
              '  if ((command === "webgpt.requirement.reconcile" || command === "automation.requirement.reconcile") && typeof record.requirementSessionId !== "string") return controlError("REQUIREMENT_SESSION_REQUIRED", "requirement reconcile 必须提供 sessionId。", command, requestId);\n  if (command === "automation.step.execute" && (typeof record.projectId !== "string" || typeof record.stepSpecId !== "string" || typeof record.providerTargetRef !== "string")) return controlError("STEP_EXECUTION_INPUT_REQUIRED", "automation step execute requires projectId, stepSpecId, and providerTargetRef.", command, requestId);\n  if ((command === "automation.step.reconcile" || command === "automation.step.verify") && (typeof record.projectId !== "string" || typeof record.executionAttemptId !== "string")) return controlError("STEP_ATTEMPT_REQUIRED", `${command} requires projectId and executionAttemptId.`, command, requestId);\n  if (command === "automation.step.review" && (typeof record.projectId !== "string" || typeof record.executionAttemptId !== "string" || (record.reviewDecision !== "APPROVE" && record.reviewDecision !== "REJECT"))) return controlError("STEP_REVIEW_INPUT_REQUIRED", "automation step review requires projectId, executionAttemptId, and reviewDecision.", command, requestId);\n  if (command === "automation.stage.gate" && (typeof record.projectId !== "string" || typeof record.stageSpecId !== "string" || (record.stageGateDecision !== "PASS" && record.stageGateDecision !== "REJECT"))) return controlError("STAGE_GATE_INPUT_REQUIRED", "automation stage gate requires projectId, stageSpecId, and stageGateDecision.", command, requestId);\n  if (command === "automation.stage.advance" && (typeof record.projectId !== "string" || typeof record.stageSpecId !== "string")) return controlError("STAGE_ADVANCE_INPUT_REQUIRED", "automation stage advance requires projectId and stageSpecId.", command, requestId);\n  if (command === "automation.project.complete" && typeof record.projectId !== "string") return controlError("PROJECT_COMPLETION_INPUT_REQUIRED", "automation project complete requires projectId.", command, requestId);\n  if (["webgpt.project.inspect",',
          )
          replace_once(
              parser,
              '    "automation.planner.result": ["projectId", "actionIntentId"],\n  };',
              '    "automation.planner.result": ["projectId", "actionIntentId"],\n    "automation.step.execute": ["projectId", "stepSpecId", "providerTargetRef"],\n    "automation.step.reconcile": ["projectId", "executionAttemptId"],\n    "automation.step.verify": ["projectId", "executionAttemptId"],\n    "automation.step.review": ["projectId", "executionAttemptId", "reviewDecision", "reviewerRef"],\n    "automation.stage.gate": ["projectId", "stageSpecId", "stageGateDecision", "gatekeeperRef"],\n    "automation.stage.advance": ["projectId", "stageSpecId"],\n    "automation.project.complete": ["projectId"],\n  };',
          )
          replace_once(
              parser,
              '    ...(typeof record.policyVersionId === "string" ? { policyVersionId: record.policyVersionId.trim() } : {}),\n  };',
              '    ...(typeof record.policyVersionId === "string" ? { policyVersionId: record.policyVersionId.trim() } : {}),\n    ...(typeof record.stepSpecId === "string" ? { stepSpecId: record.stepSpecId.trim() } : {}),\n    ...(typeof record.executionAttemptId === "string" ? { executionAttemptId: record.executionAttemptId.trim() } : {}),\n    ...(typeof record.stageSpecId === "string" ? { stageSpecId: record.stageSpecId.trim() } : {}),\n    ...(record.reviewDecision === "APPROVE" || record.reviewDecision === "REJECT" ? { reviewDecision: record.reviewDecision } : {}),\n    ...(typeof record.reviewerRef === "string" ? { reviewerRef: record.reviewerRef.trim() } : {}),\n    ...(record.stageGateDecision === "PASS" || record.stageGateDecision === "REJECT" ? { stageGateDecision: record.stageGateDecision } : {}),\n    ...(typeof record.gatekeeperRef === "string" ? { gatekeeperRef: record.gatekeeperRef.trim() } : {}),\n  };',
          )
          PY
          cat > tests/automation-governance-control-plane.test.ts <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { parseWebGptControlRequest, WEBGPT_CONTROL_PROTOCOL_VERSION } from "../src/main/webgpt-control.ts";
          import { buildControlPlaneSchema, CONTROL_PLANE_CAPABILITIES, requiredControlPlaneCapability, WEBGPT_CONTROL_COMMANDS } from "../src/shared/webgpt-control-plane-contract.ts";

          function errorCode(value: ReturnType<typeof parseWebGptControlRequest>): string | undefined {
            return "error" in value ? value.error?.code : undefined;
          }

          test("Automation governance commands use explicit stable capabilities without changing protocol version", () => {
            const expected = new Map([
              ["automation.step.execute", "automation.step"],
              ["automation.step.reconcile", "automation.step"],
              ["automation.step.verify", "automation.step"],
              ["automation.step.review", "automation.step"],
              ["automation.stage.gate", "automation.stage"],
              ["automation.stage.advance", "automation.stage"],
              ["automation.project.complete", "automation.project"],
            ] as const);
            for (const [command, capability] of expected) {
              assert.equal(WEBGPT_CONTROL_COMMANDS.includes(command), true);
              assert.equal(requiredControlPlaneCapability(command), capability);
              assert.equal(CONTROL_PLANE_CAPABILITIES.some((item) => item.name === capability && item.status === "STABLE"), true);
            }
            const schema = buildControlPlaneSchema("test");
            const properties = ((schema.$defs as Record<string, any>).request.properties) as Record<string, unknown>;
            for (const field of ["stepSpecId", "executionAttemptId", "stageSpecId", "reviewDecision", "reviewerRef", "stageGateDecision", "gatekeeperRef"]) assert.ok(properties[field]);
          });

          test("Automation Step control-plane inputs are command-scoped and normalized", () => {
            const execute = parseWebGptControlRequest({ version: WEBGPT_CONTROL_PROTOCOL_VERSION, requestId: "step-execute-1", command: "automation.step.execute", projectId: " project-a ", stepSpecId: " step-a ", providerTargetRef: " native-thread-v1:thread-1 " });
            assert.deepEqual(execute, { version: 1, requestId: "step-execute-1", command: "automation.step.execute", projectId: "project-a", providerTargetRef: "native-thread-v1:thread-1", stepSpecId: "step-a" });
            const reconcile = parseWebGptControlRequest({ version: 1, requestId: "step-reconcile-1", command: "automation.step.reconcile", projectId: "project-a", executionAttemptId: " attempt-a " });
            assert.deepEqual(reconcile, { version: 1, requestId: "step-reconcile-1", command: "automation.step.reconcile", projectId: "project-a", executionAttemptId: "attempt-a" });
            const verify = parseWebGptControlRequest({ version: 1, requestId: "step-verify-1", command: "automation.step.verify", projectId: "project-a", executionAttemptId: "attempt-a" });
            assert.deepEqual(verify, { version: 1, requestId: "step-verify-1", command: "automation.step.verify", projectId: "project-a", executionAttemptId: "attempt-a" });
            const review = parseWebGptControlRequest({ version: 1, requestId: "step-review-1", command: "automation.step.review", projectId: "project-a", executionAttemptId: "attempt-a", reviewDecision: "APPROVE", reviewerRef: " user:alice " });
            assert.deepEqual(review, { version: 1, requestId: "step-review-1", command: "automation.step.review", projectId: "project-a", executionAttemptId: "attempt-a", reviewDecision: "APPROVE", reviewerRef: "user:alice" });
          });

          test("Automation Stage and Project control-plane inputs are explicit and fail closed", () => {
            const gate = parseWebGptControlRequest({ version: 1, requestId: "stage-gate-1", command: "automation.stage.gate", projectId: "project-a", stageSpecId: " stage-a ", stageGateDecision: "PASS", gatekeeperRef: " user:bob " });
            assert.deepEqual(gate, { version: 1, requestId: "stage-gate-1", command: "automation.stage.gate", projectId: "project-a", stageSpecId: "stage-a", stageGateDecision: "PASS", gatekeeperRef: "user:bob" });
            const advance = parseWebGptControlRequest({ version: 1, requestId: "stage-advance-1", command: "automation.stage.advance", projectId: "project-a", stageSpecId: "stage-a" });
            assert.deepEqual(advance, { version: 1, requestId: "stage-advance-1", command: "automation.stage.advance", projectId: "project-a", stageSpecId: "stage-a" });
            const complete = parseWebGptControlRequest({ version: 1, requestId: "project-complete-1", command: "automation.project.complete", projectId: " project-a " });
            assert.deepEqual(complete, { version: 1, requestId: "project-complete-1", command: "automation.project.complete", projectId: "project-a" });

            assert.equal(errorCode(parseWebGptControlRequest({ version: 1, requestId: "bad-review-1", command: "automation.step.review", projectId: "project-a", executionAttemptId: "attempt-a", reviewDecision: "PASS" })), "STEP_REVIEW_DECISION_INVALID");
            assert.equal(errorCode(parseWebGptControlRequest({ version: 1, requestId: "bad-gate-1", command: "automation.stage.gate", projectId: "project-a", stageSpecId: "stage-a", stageGateDecision: "APPROVE" })), "STAGE_GATE_DECISION_INVALID");
            assert.equal(errorCode(parseWebGptControlRequest({ version: 1, requestId: "missing-attempt-1", command: "automation.step.verify", projectId: "project-a" })), "STEP_ATTEMPT_REQUIRED");
            assert.equal(errorCode(parseWebGptControlRequest({ version: 1, requestId: "provider-spoof-1", command: "automation.step.execute", projectId: "project-a", stepSpecId: "step-a", providerTargetRef: "native-thread-v1:thread-1", providerId: "WEBGPT" })), "CONTROL_FIELD_UNSUPPORTED");
            assert.equal(errorCode(parseWebGptControlRequest({ version: 1, requestId: "cross-field-1", command: "automation.stage.advance", projectId: "project-a", stageSpecId: "stage-a", executionAttemptId: "attempt-a" })), "CONTROL_FIELD_UNSUPPORTED");
          });
          EOF
      - name: Bounded diff guard
        shell: bash
        run: |
          allowed='^(.github/workflows/automation-governance-control-plane.yml|src/shared/webgpt-control-plane-contract.ts|src/main/webgpt-control.ts|tests/automation-governance-control-plane.test.ts)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff | grep -E '^\+.*(new NativeThreadRuntime|new AppServerProcessClient|createAutomationExecutionFacade|CREATE TABLE|ALTER TABLE)' 
          grep -q '"automation.step.execute"' src/shared/webgpt-control-plane-contract.ts
          grep -q '"automation.stage.gate"' src/main/webgpt-control.ts
          grep -q 'provider-spoof-1' tests/automation-governance-control-plane.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Focused control-plane tests
        run: node --experimental-strip-types --test tests/automation-governance-control-plane.test.ts tests/arch-r2-automation-control-plane.test.ts tests/webgpt-control-plane-baseline.test.ts tests/webgpt-control-contract.test.ts
      - name: Full repository tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit bounded patch and self-clean
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/automation-governance-control-plane.yml
          git add src/shared/webgpt-control-plane-contract.ts src/main/webgpt-control.ts tests/automation-governance-control-plane.test.ts
          git diff --cached --name-only | grep -Ev '^(src/shared/webgpt-control-plane-contract.ts|src/main/webgpt-control.ts|tests/automation-governance-control-plane.test.ts|.github/workflows/automation-governance-control-plane.yml)$' && exit 1 || true
          git commit -m "Automation: expose governance control-plane contract"
          git push origin HEAD:feature/automation-governance-control-plane
