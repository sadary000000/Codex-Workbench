name: Automation governance read surface gate

on:
  push:
    branches:
      - feature/automation-governance-read-surface

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded read-surface patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          contract = "src/shared/webgpt-control-plane-contract.ts"
          replace_once(
              contract,
              '  "automation.stage.advance",\n  "automation.project.complete",',
              '  "automation.stage.advance",\n  "automation.project.inspect",\n  "automation.project.complete",',
          )
          replace_once(
              contract,
              '  "automation.stage.advance": "automation.stage",\n  "automation.project.complete": "automation.project",',
              '  "automation.stage.advance": "automation.stage",\n  "automation.project.inspect": "automation.project",\n  "automation.project.complete": "automation.project",',
          )

          parser = "src/main/webgpt-control.ts"
          replace_once(
              parser,
              '  if (command === "automation.project.complete" && typeof record.projectId !== "string") return controlError("PROJECT_COMPLETION_INPUT_REQUIRED", "automation project complete requires projectId.", command, requestId);',
              '  if (command === "automation.project.inspect" && typeof record.projectId !== "string") return controlError("PROJECT_INSPECT_INPUT_REQUIRED", "automation project inspect requires projectId.", command, requestId);\n  if (command === "automation.project.complete" && typeof record.projectId !== "string") return controlError("PROJECT_COMPLETION_INPUT_REQUIRED", "automation project complete requires projectId.", command, requestId);',
          )
          replace_once(
              parser,
              '    "automation.stage.advance": ["projectId", "stageSpecId"],\n    "automation.project.complete": ["projectId"],',
              '    "automation.stage.advance": ["projectId", "stageSpecId"],\n    "automation.project.inspect": ["projectId"],\n    "automation.project.complete": ["projectId"],',
          )

          main = "src/main/main.ts"
          replace_once(
              main,
              '  automationStageAdvance: "automation:stage:advance",\n  automationProjectComplete: "automation:project:complete",',
              '  automationStageAdvance: "automation:stage:advance",\n  automationProjectGovernance: "automation:project:governance",\n  automationProjectComplete: "automation:project:complete",',
          )
          replace_once(
              main,
              '    } else if (request.command === "automation.project.complete") {\n      if (!request.projectId) response = controlFail(request.command, "PROJECT_COMPLETION_INPUT_REQUIRED", "automation project complete requires projectId.");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.completeProject({ projectId: request.projectId }));',
              '    } else if (request.command === "automation.project.inspect") {\n      if (!request.projectId) response = controlFail(request.command, "PROJECT_INSPECT_INPUT_REQUIRED", "automation project inspect requires projectId.");\n      else response = controlOk(request.command, await getAutomationProviderHost().governance.inspect(request.projectId));\n    } else if (request.command === "automation.project.complete") {\n      if (!request.projectId) response = controlFail(request.command, "PROJECT_COMPLETION_INPUT_REQUIRED", "automation project complete requires projectId.");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.completeProject({ projectId: request.projectId }));',
          )
          main_handler = [
              '  ipcMain.handle(IPC.automationProjectGovernance, async (_event, projectId: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256) throw codedError("PROJECT_INSPECT_INPUT_REQUIRED", "Automation governance read requires a bounded Project ID.");',
              '      return ok(await getAutomationProviderHost().governance.inspect(projectId.trim()));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
          ]
          replace_once(
              main,
              '  ipcMain.handle(IPC.automationProjectComplete, async (_event, projectId: unknown) => {',
              "\n".join(main_handler) + '\n  ipcMain.handle(IPC.automationProjectComplete, async (_event, projectId: unknown) => {',
          )

          preload = "src/preload/preload.cts"
          replace_once(
              preload,
              '  automationStageAdvance: "automation:stage:advance",\n  automationProjectComplete: "automation:project:complete",',
              '  automationStageAdvance: "automation:stage:advance",\n  automationProjectGovernance: "automation:project:governance",\n  automationProjectComplete: "automation:project:complete",',
          )
          replace_once(
              preload,
              '  advanceAutomationStage: (projectId: string, stageSpecId: string) => ipcRenderer.invoke(channels.automationStageAdvance, String(projectId ?? "").slice(0, 256), String(stageSpecId ?? "").slice(0, 256)),\n  completeAutomationProject:',
              '  advanceAutomationStage: (projectId: string, stageSpecId: string) => ipcRenderer.invoke(channels.automationStageAdvance, String(projectId ?? "").slice(0, 256), String(stageSpecId ?? "").slice(0, 256)),\n  getAutomationGovernanceProject: (projectId: string) => ipcRenderer.invoke(channels.automationProjectGovernance, String(projectId ?? "").slice(0, 256)),\n  completeAutomationProject:',
          )

          renderer = "src/renderer/renderer.ts"
          replace_once(
              renderer,
              'import type { ConversationMapStatus, MapEntityRef, MapNode, MapSourceRef, ProjectMapMaintenanceView, ProjectMapStatus } from "../shared/map-types.ts";',
              'import type { ConversationMapStatus, MapEntityRef, MapNode, MapSourceRef, ProjectMapMaintenanceView, ProjectMapStatus } from "../shared/map-types.ts";\nimport type { AutomationGovernanceProjectView } from "../shared/automation-governance-types.ts";',
          )
          replace_once(
              renderer,
              '  advanceAutomationStage(projectId: string, stageSpecId: string): Promise<IpcEnvelope<unknown>>;\n  completeAutomationProject',
              '  advanceAutomationStage(projectId: string, stageSpecId: string): Promise<IpcEnvelope<unknown>>;\n  getAutomationGovernanceProject(projectId: string): Promise<IpcEnvelope<AutomationGovernanceProjectView>>;\n  completeAutomationProject',
          )
          PY

          cat > tests/automation-governance-read-surface.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";
          import { parseWebGptControlRequest } from "../src/main/webgpt-control.ts";
          import { requiredControlPlaneCapability, WEBGPT_CONTROL_COMMANDS } from "../src/shared/webgpt-control-plane-contract.ts";

          test("Automation governance projection is readable through both narrow product surfaces", async () => {
            assert.equal(WEBGPT_CONTROL_COMMANDS.includes("automation.project.inspect"), true);
            assert.equal(requiredControlPlaneCapability("automation.project.inspect"), "automation.project");
            assert.deepEqual(parseWebGptControlRequest({ version: 1, requestId: "inspect-1", command: "automation.project.inspect", projectId: " project-a " }), {
              version: 1,
              requestId: "inspect-1",
              command: "automation.project.inspect",
              projectId: "project-a",
            });

            const [main, preload, renderer] = await Promise.all([
              readFile(new URL("../src/main/main.ts", import.meta.url), "utf8"),
              readFile(new URL("../src/preload/preload.cts", import.meta.url), "utf8"),
              readFile(new URL("../src/renderer/renderer.ts", import.meta.url), "utf8"),
            ]);
            assert.match(main, /request\.command === "automation\.project\.inspect"/);
            assert.match(main, /getAutomationProviderHost\(\)\.governance\.inspect\(request\.projectId\)/);
            assert.match(main, /IPC\.automationProjectGovernance/);
            assert.match(main, /getAutomationProviderHost\(\)\.governance\.inspect\(projectId\.trim\(\)\)/);
            assert.match(preload, /automationProjectGovernance: "automation:project:governance"/);
            assert.match(preload, /getAutomationGovernanceProject:/);
            assert.match(renderer, /getAutomationGovernanceProject\(projectId: string\): Promise<IpcEnvelope<AutomationGovernanceProjectView>>/);
            assert.doesNotMatch(preload, /automation:governance:invoke/);
          });

          test("Automation project inspect is project-scoped and rejects unrelated fields", () => {
            const missing = parseWebGptControlRequest({ version: 1, requestId: "inspect-missing", command: "automation.project.inspect" });
            assert.equal("error" in missing ? missing.error?.code : null, "PROJECT_INSPECT_INPUT_REQUIRED");
            const spoof = parseWebGptControlRequest({ version: 1, requestId: "inspect-spoof", command: "automation.project.inspect", projectId: "project-a", stageSpecId: "stage-a" });
            assert.equal("error" in spoof ? spoof.error?.code : null, "CONTROL_FIELD_UNSUPPORTED");
          });
          EOF
      - name: Bounded diff guard
        shell: bash
        run: |
          allowed='^(.github/workflows/automation-governance-read-surface.yml|src/shared/webgpt-control-plane-contract.ts|src/main/webgpt-control.ts|src/main/main.ts|src/preload/preload.cts|src/renderer/renderer.ts|tests/automation-governance-read-surface.test.ts)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff | grep -E '^\+.*(new NativeThreadRuntime|new AppServerProcessClient|createAutomationExecutionFacade|createAutomationProviderHost\(|\.store\.snapshot\(|authToken|controlDescriptor|CREATE TABLE|ALTER TABLE)'
          grep -q 'automation.project.inspect' src/shared/webgpt-control-plane-contract.ts
          grep -q 'governance.inspect' src/main/main.ts
          grep -q 'getAutomationGovernanceProject' src/preload/preload.cts
      - name: Typecheck
        run: npm run typecheck
      - name: Focused read-surface and projection tests
        run: node --experimental-strip-types --test tests/automation-governance-read-surface.test.ts tests/automation-governance-projection.test.ts tests/automation-governance-preload-bridge.test.ts tests/automation-governance-control-plane.test.ts tests/automation-governance-control-plane-dispatch.test.ts
      - name: Full repository tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit bounded patch and self-clean
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/automation-governance-read-surface.yml
          git add src/shared/webgpt-control-plane-contract.ts src/main/webgpt-control.ts src/main/main.ts src/preload/preload.cts src/renderer/renderer.ts tests/automation-governance-read-surface.test.ts
          git diff --cached --name-only | grep -Ev '^(src/shared/webgpt-control-plane-contract.ts|src/main/webgpt-control.ts|src/main/main.ts|src/preload/preload.cts|src/renderer/renderer.ts|tests/automation-governance-read-surface.test.ts|.github/workflows/automation-governance-read-surface.yml)$' && exit 1 || true
          git commit -m "Automation: expose governance read surface"
          git push origin HEAD:feature/automation-governance-read-surface
