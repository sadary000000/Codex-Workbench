name: ARCH-R3 bounded query boundary patch
on:
  push:
    branches:
      - arch-r3/query-reconcile-boundary
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch-r3/query-reconcile-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore base bytes and apply minimal semantic patch
        run: python .github/scripts/arch-r3-clean-diff.py
      - name: Enforce small diff
        shell: bash
        run: |
          git diff --check
          lines=$(git diff --numstat 36477bcd75e7c43c3704575eb06fcd31da7a1bb3 -- src/features/webgpt/runtime/webgpt-request-manager.ts src/features/webgpt/automation/webgpt-provider-port.ts src/main/main.ts tests/arch-v2-6-provider-boundary.test.ts tests/arch-r3-query-reconcile-boundary.test.ts | awk '{a+=$1; d+=$2} END {print a+d}')
          echo "semantic changed lines: ${lines:-0}"
          test "${lines:-9999}" -le 80
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: R3 source-contract tests
        run: node --experimental-strip-types --test tests/arch-r3-query-reconcile-boundary.test.ts
      - name: Provider boundary regression
        run: node --experimental-strip-types --test tests/arch-v2-6-provider-boundary.test.ts
      - name: Request manager purity regression
        run: node --experimental-strip-types --test tests/webgpt-request-manager.test.ts
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit minimal semantic patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/webgpt/runtime/webgpt-request-manager.ts src/features/webgpt/automation/webgpt-provider-port.ts src/main/main.ts tests/arch-v2-6-provider-boundary.test.ts tests/arch-r3-query-reconcile-boundary.test.ts
          git commit -m "refactor(arch-r3): normalize query/reconcile boundary diff" || true
          git push origin HEAD:arch-r3/query-reconcile-boundary
