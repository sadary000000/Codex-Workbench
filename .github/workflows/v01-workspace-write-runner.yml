name: v0.1 Workspace Write Runner

on:
  push:
    branches:
      - release/v0.1-integration
    paths:
      - .github/workflow-triggers/v01-workspace-write

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Extract reviewed patch script
        shell: python
        run: |
          from pathlib import Path
          lines = Path('.github/workflows/v01-workspace-write-contract.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Apply reviewed workspace-write contract'
          start = lines.index(marker)
          run_line = next(index for index in range(start + 1, len(lines)) if lines[index] == '        run: |')
          end = next(index for index in range(run_line + 1, len(lines)) if lines[index] == '      - name: Install dependencies')
          body = []
          for line in lines[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          if not body:
              raise SystemExit('reviewed patch script was empty')
          Path('/tmp/apply-v01-workspace-write.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
      - name: Apply reviewed patch
        run: python /tmp/apply-v01-workspace-write.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Workspace-write focused regression
        run: node --experimental-strip-types --test tests/v01-workspace-write-contract.test.ts tests/arch-r2-shared-native-runtime.test.ts tests/automation-native-step-executor.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'Feature: authorize bounded Native workspace writes'
          git push origin HEAD:release/v0.1-integration
