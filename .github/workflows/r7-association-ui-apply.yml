name: R7 association UI apply

on:
  push:
    branches:
      - feature/r7-project-automation-association-ui

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/r7-project-automation-association-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded UI patch
        run: python3 .github/r7-association-ui-apply.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test service list without Automation
        run: node --experimental-strip-types --test --test-name-pattern="listing Product-owned associations" tests/r7-project-automation-association-service.test.ts
      - name: Test service unlink without Automation
        run: node --experimental-strip-types --test --test-name-pattern="unlink remains available" tests/r7-project-automation-association-service.test.ts
      - name: Test service candidate read
        run: node --experimental-strip-types --test --test-name-pattern="candidate listing" tests/r7-project-automation-association-service.test.ts
      - name: Test service bind existing target
        run: node --experimental-strip-types --test --test-name-pattern="bind verifies" tests/r7-project-automation-association-service.test.ts
      - name: Test service bind missing target
        run: node --experimental-strip-types --test --test-name-pattern="bind fails closed" tests/r7-project-automation-association-service.test.ts
      - name: Test R7 association UI wiring
        run: node --experimental-strip-types --test tests/r7-project-automation-association-ui.test.ts
      - name: Test startup independence regression
        run: node --experimental-strip-types --test tests/arch-v2-8-startup-idle.test.ts
      - name: Test full repository
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified slice
        shell: bash
        run: |
          rm .github/r7-association-ui-apply.py
          rm .github/workflows/r7-association-ui-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(r7): add explicit automation association UI"
          git push origin HEAD:feature/r7-project-automation-association-ui
