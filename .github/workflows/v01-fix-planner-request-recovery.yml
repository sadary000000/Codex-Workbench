name: v0.1 Planner Request Identity Recovery Repair

on:
  push:
    branches:
      - release/v0.1-integration
    paths:
      - .github/workflows/v01-fix-planner-request-recovery.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded Planner request recovery repair
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, label: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} match(es) in {path}, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Provider-neutral seam: recovery may carry the opaque input identity and
          # prior request exclusions, but it still only returns an existing request.
          replace_exact(
              "src/automation/adapters.ts",
              '  /** Read-only crash recovery lookup; it may only resolve an existing request by idempotency. */\n  resolveRequestByCorrelation?(input: { idempotencyRef: string; correlation: ProviderCorrelation }): Promise<ProviderRequestRef | null>;',
              '  /** Read-only crash recovery lookup; it may only resolve an already-existing request. */\n  resolveRequestByCorrelation?(input: { idempotencyRef: string; correlation: ProviderCorrelation; inputRef?: string | null; excludeProviderRequestRefs?: readonly ProviderRequestRef[] }): Promise<ProviderRequestRef | null>;',
              "provider recovery seam",
          )

          # Native provider: derive the exact prompt hash from the opaque Automation
          # InputRef and ask the shared runtime for a read-only existing-Turn lookup.
          replace_exact(
              "src/codex/automation/native-provider-port.ts",
              'const RESULT_PREFIX = "native-turn-result-v1:";',
              'const RESULT_PREFIX = "native-turn-result-v1:";\nconst INPUT_REF_PREFIX = "automation-input-v1:";\nconst SHA256_HEX = /^[a-f0-9]{64}$/i;',
              "native input ref constants",
          )
          replace_exact(
              "src/codex/automation/native-provider-port.ts",
              '  hasThread(nativeThreadId: string): Promise<boolean>;\n  startTurn(input: { nativeThreadId: string; prompt: string }): Promise<{ nativeTurnId: string }>;',
              '  hasThread(nativeThreadId: string): Promise<boolean>;\n  /** Read-only identity recovery; it must never start or resume a Turn. */\n  resolveTurnByPromptSha256?(input: { nativeThreadId: string; promptSha256: string; excludeTurnIds: readonly string[] }): Promise<string | null>;\n  startTurn(input: { nativeThreadId: string; prompt: string }): Promise<{ nativeTurnId: string }>;',
              "native runtime recovery seam",
          )
          replace_exact(
              "src/codex/automation/native-provider-port.ts",
              'function ensureCorrelation(correlation: ProviderCorrelation): void {',
              'function parseAutomationInputRef(value: string | null | undefined): string | null {\n  if (!value?.startsWith(INPUT_REF_PREFIX)) return null;\n  const digest = value.slice(INPUT_REF_PREFIX.length);\n  return SHA256_HEX.test(digest) ? digest.toLowerCase() : null;\n}\n\nfunction ensureCorrelation(correlation: ProviderCorrelation): void {',
              "native input ref parser",
          )
          replace_exact(
              "src/codex/automation/native-provider-port.ts",
              '  async submit(input: ProviderSubmitInput): Promise<ProviderRequestAccepted> {',
              '''  async resolveRequestByCorrelation(input: { idempotencyRef: string; correlation: ProviderCorrelation; inputRef?: string | null; excludeProviderRequestRefs?: readonly string[] }): Promise<string | null> {
            ensureCorrelation(input.correlation);
            if (!input.idempotencyRef || input.idempotencyRef !== input.correlation.idempotencyRef) throw new Error("PROVIDER_CORRELATION_REQUIRED");
            if (!this.runtime.resolveTurnByPromptSha256) return null;
            const providerScopeRef = input.correlation.providerScopeRef;
            if (!providerScopeRef) return null;
            const nativeThreadId = parseNativeThreadTargetRef(providerScopeRef);
            const promptSha256 = parseAutomationInputRef(input.inputRef);
            if (!promptSha256 || !(await this.runtime.hasThread(nativeThreadId))) return null;
            return this.runtime.resolveTurnByPromptSha256({
              nativeThreadId,
              promptSha256,
              excludeTurnIds: input.excludeProviderRequestRefs ?? [],
            });
          }

            async submit(input: ProviderSubmitInput): Promise<ProviderRequestAccepted> {''',
              "native read-only request resolver",
          )

          # Shared Native runtime: scan the exact attached thread projection, match
          # the exact user prompt hash, exclude already-bound retry Turns, and fail
          # closed on zero or ambiguous matches.
          replace_exact(
              "src/main/native-provider-runtime-adapter.ts",
              '  async runtimeCapability(): Promise<ProviderRuntimeCapability> {',
              '''  async resolveTurnByPromptSha256(input: { nativeThreadId: string; promptSha256: string; excludeTurnIds: readonly string[] }): Promise<string | null> {
            const nativeThreadId = boundedId(input.nativeThreadId, "NATIVE_THREAD_ID");
            const promptSha256 = input.promptSha256.trim().toLowerCase();
            if (!/^[a-f0-9]{64}$/.test(promptSha256)) throw new Error("NATIVE_PROMPT_SHA256_INVALID");
            const runtime = this.registry.get(nativeThreadId);
            if (!runtime) return null;
            const excluded = new Set(input.excludeTurnIds.map((turnId) => boundedId(turnId, "NATIVE_TURN_ID")));
            const read = await runtime.readThread();
            if (read.nativeThreadId !== nativeThreadId) throw new Error("NATIVE_TURN_THREAD_MISMATCH");
            const matches = read.turns
              .filter((turn) => turn.id !== null && !excluded.has(turn.id))
              .filter((turn) => turn.items.some((item) => item.type === "userMessage" && typeof item.text === "string" && hash(item.text) === promptSha256))
              .map((turn) => turn.id!)
              .filter((turnId, index, values) => values.indexOf(turnId) === index);
            if (matches.length !== 1) return null;
            const nativeTurnId = boundedId(matches[0]!, "NATIVE_TURN_ID");
            const existing = this.turns.get(nativeTurnId);
            this.turns.set(nativeTurnId, { nativeThreadId, completion: existing?.completion ?? null, completed: existing?.completed ?? null });
            return nativeTurnId;
          }

            async runtimeCapability(): Promise<ProviderRuntimeCapability> {''',
              "shared native prompt-hash recovery",
          )

          # Planner: always address the latest bounded attempt and, if turn/start may
          # have succeeded before its ID was persisted, recover that existing request
          # identity before running the normal reconcile -> validate -> promote path.
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              'function operationFrom(value: unknown): PlannerProviderOperation {',
              '''function latestAttemptForIntent(snapshot: Awaited<ReturnType<AutomationStore["snapshot"]>>, intentId: string): ActionAttempt | null {
            return snapshot.actionAttempts
              .filter((item) => item.intentId === intentId)
              .sort((left, right) => left.dispatchNumber - right.dispatchNumber)
              .at(-1) ?? null;
          }

          function automationInputSha256(inputRef: string | null | undefined): string | null {
            if (!inputRef) return null;
            const match = /^automation-input-v1:([a-f0-9]{64})$/i.exec(inputRef);
            return match?.[1]?.toLowerCase() ?? null;
          }

          function operationFrom(value: unknown): PlannerProviderOperation {''',
              "planner recovery helpers",
          )
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              '      const existingAttempt = snapshot.actionAttempts.find((item) => item.intentId === existingIntent.intentId) ?? null;',
              '      const existingAttempt = latestAttemptForIntent(snapshot, existingIntent.intentId);',
              "planner create latest attempt",
          )
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              '    const requestExternal = providerRefFor(snapshot, attempt, this.provider.provider);',
              '    let reconciledAttempt = attempt;\n    let requestExternal = providerRefFor(snapshot, attempt, this.provider.provider);',
              "planner mutable recovery request",
          )
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              '    if (!requestExternal) return emptyResult({ status: "RECOVERY_REQUIRED", actionIntentId: intent.intentId, actionAttemptId: attempt.actionAttemptId, request, errorCode: "REQUEST_CORRELATION_MISSING", errorMessage: "The existing Planner request reference is unavailable; no replacement request is allowed." });',
              '''    if (!requestExternal && this.provider.resolveRequestByCorrelation && intent.idempotencyRef) {
              const excludeProviderRequestRefs = snapshot.actionAttempts
                .filter((candidate) => candidate.intentId === intent.intentId && candidate.actionAttemptId !== attempt.actionAttemptId)
                .map((candidate) => providerRefFor(snapshot, candidate, this.provider.provider)?.opaqueId ?? null)
                .filter((value): value is string => value !== null);
              let recoveredProviderRequestRef: string | null;
              try {
                recoveredProviderRequestRef = await this.provider.resolveRequestByCorrelation({
                  idempotencyRef: intent.idempotencyRef,
                  correlation: correlation(intent, attempt, request),
                  inputRef: request.inputRefs[0] ?? null,
                  excludeProviderRequestRefs,
                });
              } catch (error) {
                return emptyResult({ status: "RECOVERY_REQUIRED", actionIntentId: intent.intentId, actionAttemptId: attempt.actionAttemptId, request, errorCode: "REQUEST_RECOVERY_LOOKUP_FAILED", errorMessage: errorMessage(error) });
              }
              if (recoveredProviderRequestRef) {
                try {
                  const persisted = await this.store.persistActionAttemptProviderRequest({
                    projectId: project.projectId,
                    actionAttemptId: attempt.actionAttemptId,
                    provider: this.provider.provider,
                    providerRequestRef: recoveredProviderRequestRef,
                    providerSemanticSha256: automationInputSha256(request.inputRefs[0] ?? null),
                  });
                  requestExternal = { externalRefId: persisted.externalRef.externalRefId, opaqueId: persisted.externalRef.opaqueId };
                  reconciledAttempt = persisted.attempt;
                } catch (error) {
                  return emptyResult({ status: "RECOVERY_REQUIRED", actionIntentId: intent.intentId, actionAttemptId: attempt.actionAttemptId, providerRequestRef: recoveredProviderRequestRef, request, errorCode: "REQUEST_RECOVERY_PERSIST_FAILED", errorMessage: errorMessage(error) });
                }
              }
            }
            if (!requestExternal) return emptyResult({ status: "RECOVERY_REQUIRED", actionIntentId: intent.intentId, actionAttemptId: attempt.actionAttemptId, request, errorCode: "REQUEST_CORRELATION_MISSING", errorMessage: "The existing Planner request reference is unavailable; no replacement request is allowed." });''',
              "planner request identity recovery",
          )
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              '    const providerSemanticRef = attempt.providerSemanticSha256 ?? null;\n    const requestCorrelation = correlation(intent, attempt, request, providerSemanticRef);',
              '    const providerSemanticRef = reconciledAttempt.providerSemanticSha256 ?? null;\n    const requestCorrelation = correlation(intent, reconciledAttempt, request, providerSemanticRef);',
              "planner recovered correlation",
          )
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              '    return this.finishObservation({ projectId: project.projectId, intent, attempt, request, providerRequestRef: requestExternal.opaqueId, requestExternal, observation, providerSemanticRef, reconcile: true });',
              '    return this.finishObservation({ projectId: project.projectId, intent, attempt: reconciledAttempt, request, providerRequestRef: requestExternal.opaqueId, requestExternal, observation, providerSemanticRef, reconcile: true });',
              "planner recovered observation",
          )
          replace_exact(
              "src/automation/planner-provider-integration.ts",
              '    const attempt = snapshot.actionAttempts.find((item) => item.intentId === intent.intentId) ?? null;',
              '    const attempt = latestAttemptForIntent(snapshot, intent.intentId);',
              "planner status/result latest attempt",
              expected=2,
          )

          # Planner regression: a timeout with no locally persisted provider request
          # can recover an already-existing request and promote without submit #2.
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              '  providerResultHash: string | null = null;',
              '  providerResultHash: string | null = null;\n  resolvedRequestRef: string | null = null;\n  resolveCount = 0;\n  lastRecoveryInputRef: string | null = null;\n  lastExcludedProviderRequestRefs: readonly string[] = [];',
              "fake provider recovery fields",
          )
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              '  async submit(input: ProviderSubmitInput): Promise<ProviderRequestAccepted> {',
              '''  async resolveRequestByCorrelation(input: { idempotencyRef: string; correlation: ProviderCorrelation; inputRef?: string | null; excludeProviderRequestRefs?: readonly string[] }): Promise<string | null> {
            this.resolveCount += 1;
            this.lastRecoveryInputRef = input.inputRef ?? null;
            this.lastExcludedProviderRequestRefs = [...(input.excludeProviderRequestRefs ?? [])];
            return this.resolvedRequestRef;
          }

            async submit(input: ProviderSubmitInput): Promise<ProviderRequestAccepted> {''',
              "fake provider recovery resolver",
          )
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              'test("K1-C ambiguous submit failure is UNKNOWN and replay/reconcile never resubmits", async () => {\n  const value = await fixture();\n  const provider = new FakePlannerProvider();',
              'test("K1-C ambiguous submit failure recovers an existing provider request without resubmission", async () => {\n  const value = await fixture();\n  const provider = new FakePlannerProvider();\n  const inputRef = "automation-input-v1:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa";',
              "planner recovery test header",
          )
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              '    const first = await service.createPlanFromRequirement({ projectId: PROJECT_ID, providerTargetRef: TARGET, planningConstraints: ["no resend"] });',
              '    const first = await service.createPlanFromRequirement({ projectId: PROJECT_ID, providerTargetRef: TARGET, planningConstraints: ["no resend"], inputRefs: [inputRef] });',
              "planner recovery first request",
          )
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              '    const replay = await service.createPlanFromRequirement({ projectId: PROJECT_ID, providerTargetRef: TARGET, planningConstraints: ["no resend"] });',
              '    const replay = await service.createPlanFromRequirement({ projectId: PROJECT_ID, providerTargetRef: TARGET, planningConstraints: ["no resend"], inputRefs: [inputRef] });',
              "planner recovery replay",
          )
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              '    const reconcile = await service.reconcilePlannerRequest({ projectId: PROJECT_ID, actionAttemptId: first.actionAttemptId! });\n    assert.equal(reconcile.status, "RECOVERY_REQUIRED");\n    assert.equal(reconcile.errorCode, "REQUEST_CORRELATION_MISSING");\n    assert.equal(provider.reconcileCount, 0, "without an accepted opaque request ref, reconcile must not guess or call the provider");\n    assert.equal(provider.submitted.length, 1);',
              '''    provider.resolvedRequestRef = "planner-request-1";
            provider.submitError = null;
            const reconcile = await service.reconcilePlannerRequest({ projectId: PROJECT_ID, actionAttemptId: first.actionAttemptId! });
            assert.equal(reconcile.status, "PLAN_READY");
            assert.equal(provider.resolveCount, 1);
            assert.equal(provider.lastRecoveryInputRef, inputRef);
            assert.deepEqual(provider.lastExcludedProviderRequestRefs, []);
            assert.equal(provider.reconcileCount, 1);
            assert.equal(provider.submitted.length, 1, "read-only recovery must never resubmit the Planner request");
            const recoveredSnapshot = await value.store.snapshot();
            assert.equal(recoveredSnapshot.planVersions.length, 1);
            assert.equal(recoveredSnapshot.automationProjects[0]?.activePlanVersionId, reconcile.planVersion?.planVersionId);
            assert.ok(recoveredSnapshot.actionAttempts[0]?.providerRequestRef, "recovered provider request identity must be persisted before promotion");''',
              "planner recovery test assertions",
          )
          replace_exact(
              "tests/stage-k1-c-planner-provider.test.ts",
              '    assert.equal(snapshot.automationProjects[0]?.activePlanVersionId, second.planVersion?.planVersionId);\n\n    const replay = await service.retryPlannerRequest({ projectId: PROJECT_ID, actionIntentId: first.actionIntentId! });',
              '    assert.equal(snapshot.automationProjects[0]?.activePlanVersionId, second.planVersion?.planVersionId);\n    const latestStatus = await service.plannerStatus({ projectId: PROJECT_ID, actionIntentId: first.actionIntentId! });\n    const latestResult = await service.plannerResult({ projectId: PROJECT_ID, actionIntentId: first.actionIntentId! });\n    assert.equal(latestStatus.actionAttemptId, second.actionAttemptId, "Planner status must report the latest retry attempt");\n    assert.equal(latestResult.actionAttemptId, second.actionAttemptId, "Planner result must report the latest retry attempt");\n\n    const replay = await service.retryPlannerRequest({ projectId: PROJECT_ID, actionIntentId: first.actionIntentId! });',
              "planner latest retry read model regression",
          )

          # Native provider regression: request recovery is read-only and forwards the
          # exact prompt hash/exclusion set to the shared runtime.
          replace_exact(
              "tests/arch-r2-native-provider.test.ts",
              'test("ARCH-R2 Native submit timeout produces no fabricated acceptance and no internal retry", async () => {',
              '''test("ARCH-R2 Native recovery resolves an existing Turn by opaque input identity without dispatch", async () => {
            const nativeRuntime = createRuntime();
            const promptSha256 = "a".repeat(64);
            nativeRuntime.resolveTurnByPromptSha256 = async (input) => {
              assert.equal(input.nativeThreadId, "thread-r2");
              assert.equal(input.promptSha256, promptSha256);
              assert.deepEqual(input.excludeTurnIds, ["turn-old"]);
              return "turn-r2";
            };
            const port = provider(nativeRuntime);
            const recovered = await port.resolveRequestByCorrelation!({
              idempotencyRef: correlation.idempotencyRef!,
              correlation,
              inputRef: `automation-input-v1:${promptSha256}`,
              excludeProviderRequestRefs: ["turn-old"],
            });
            assert.equal(recovered, "turn-r2");
            assert.equal(nativeRuntime.starts, 0, "identity recovery must not call turn/start");
          });

          test("ARCH-R2 Native submit timeout produces no fabricated acceptance and no internal retry", async () => {''',
              "native provider recovery regression",
          )

          # Shared runtime regression: identical old retry prompts are safe only when
          # prior bound Turns are excluded; otherwise ambiguity fails closed.
          replace_exact(
              "tests/arch-r2-shared-native-runtime.test.ts",
              'import assert from "node:assert/strict";',
              'import assert from "node:assert/strict";\nimport { createHash } from "node:crypto";',
              "shared runtime hash import",
          )
          shared_runtime_test = '''

          test("ARCH-R2 shared Native recovery selects exactly one unbound Turn with the exact prompt hash", async () => {
            const h = harness();
            const prompt = "planner prompt";
            const promptSha256 = createHash("sha256").update(prompt, "utf8").digest("hex");
            const view: ThreadReadView = {
              nativeThreadId: "thread-r2-shared",
              status: "ready",
              title: null,
              cwd: "/workspace",
              error: null,
              turns: [
                { id: "turn-old", status: "completed", error: null, items: [{ id: "item-old", type: "userMessage", status: null, kind: "known", text: prompt, input: null, output: null, error: null, raw: {} }], itemCount: 1, raw: {} },
                { id: "turn-recovered", status: "completed", error: null, items: [{ id: "item-recovered", type: "userMessage", status: null, kind: "known", text: prompt, input: null, output: null, error: null, raw: {} }], itemCount: 1, raw: {} },
              ],
              raw: {},
            };
            h.setRead(view);
            const adapter = new SharedNativeProviderRuntimeAdapter({ registry: h.registry, runtimeId: "workbench-process-r2" });

            assert.equal(await adapter.resolveTurnByPromptSha256({ nativeThreadId: "thread-r2-shared", promptSha256, excludeTurnIds: ["turn-old"] }), "turn-recovered");
            assert.equal(await adapter.resolveTurnByPromptSha256({ nativeThreadId: "thread-r2-shared", promptSha256, excludeTurnIds: [] }), null, "ambiguous same-prompt history must fail closed");
            assert.equal(h.counters.starts, 0, "read-only recovery must never start a Native Turn");
          });
          '''
          shared_path = Path("tests/arch-r2-shared-native-runtime.test.ts")
          shared_path.write_text(shared_path.read_text(encoding="utf-8") + shared_runtime_test, encoding="utf-8")

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused Planner recovery regression
        run: node --experimental-strip-types --test tests/stage-k1-c-planner-provider.test.ts tests/arch-r2-native-provider.test.ts tests/arch-r2-shared-native-runtime.test.ts
      - name: Full tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/automation/adapters.ts src/automation/planner-provider-integration.ts src/codex/automation/native-provider-port.ts src/main/native-provider-runtime-adapter.ts tests/stage-k1-c-planner-provider.test.ts tests/arch-r2-native-provider.test.ts tests/arch-r2-shared-native-runtime.test.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix: recover missing Planner Native request identity"
          git push origin HEAD:release/v0.1-integration
