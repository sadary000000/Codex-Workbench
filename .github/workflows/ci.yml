name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional branch, tag, or commit SHA to verify'
        required: false
        type: string
  push:
    branches:
      - codex/workbench-v1
      - workbench/next
  pull_request:
    branches:
      - codex/workbench-v1
      - workbench/next

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
