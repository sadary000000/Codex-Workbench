name: ARCH-R2 fix control patch gate

on:
  push:
    branches:
      - arch-r2/provider-execution-boundary
    paths:
      - .github/workflows/arch-r2-fix-control-gate.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch-r2/provider-execution-boundary
          fetch-depth: 0
      - name: Include untracked test in safety gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/arch-r2-automation-control-cutover.yml')
          text = path.read_text(encoding='utf-8')
          old = '          mapfile -t changed < <(git diff --name-only)\n'
          new = '          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)\n'
          if text.count(old) != 1:
              raise SystemExit('expected one tracked-only changed-files gate')
          text = text.replace(old, new, 1)
          old_count = '          test "${#changed[@]}" -eq 5\n'
          if text.count(old_count) != 1:
              raise SystemExit('expected one five-file count gate')
          text = text.replace(old_count, '          test "${#changed[@]}" -eq 5\n          git add -N tests/arch-r2-automation-control-plane.test.ts\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit gate fix and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arch-r2-fix-control-gate.yml
          git add .github/workflows/arch-r2-automation-control-cutover.yml
          git commit -m "fix(arch-r2): include untracked test in patch gate"
          git push origin HEAD:arch-r2/provider-execution-boundary
