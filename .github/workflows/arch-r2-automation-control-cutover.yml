name: ARCH-R2 automation control cutover

on:
  push:
    branches:
      - arch-r2/provider-execution-boundary
    paths:
      - .github/workflows/arch-r2-automation-control-cutover.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch-r2/provider-execution-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply bounded provider-neutral control patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new, label):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match in {path_s}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          contract = 'src/shared/webgpt-control-plane-contract.ts'
          replace_once(contract,
              '  { name: "webgpt.requirement", status: "STABLE", description: "Provider-neutral Requirement alignment entry and recovery lifecycle." },\n  { name: "webgpt.planner", status: "STABLE", description: "Provider-neutral Planner create, retry, reconcile, status, and result lifecycle." },\n',
              '  { name: "webgpt.requirement", status: "STABLE", description: "Explicit WebGPT Requirement compatibility entry and recovery lifecycle." },\n  { name: "webgpt.planner", status: "STABLE", description: "Explicit WebGPT Planner compatibility create, retry, reconcile, status, and result lifecycle." },\n  { name: "automation.requirement", status: "STABLE", description: "Provider-neutral Requirement lifecycle; new work defaults to Native and continuations restore persisted provider identity." },\n  { name: "automation.planner", status: "STABLE", description: "Provider-neutral Planner lifecycle; new work defaults to Native and recovery preserves persisted provider identity." },\n',
              'add neutral automation capabilities')
          replace_once(contract,
              '  "webgpt.planner.result",\n] as const;\n',
              '  "webgpt.planner.result",\n  "automation.requirement.start",\n  "automation.requirement.draft",\n  "automation.requirement.reconcile",\n  "automation.planner.create",\n  "automation.planner.reconcile",\n  "automation.planner.retry",\n  "automation.planner.status",\n  "automation.planner.result",\n] as const;\n',
              'add neutral automation commands')
          replace_once(contract,
              '  "webgpt.planner.result": "webgpt.planner",\n});\n',
              '  "webgpt.planner.result": "webgpt.planner",\n  "automation.requirement.start": "automation.requirement",\n  "automation.requirement.draft": "automation.requirement",\n  "automation.requirement.reconcile": "automation.requirement",\n  "automation.planner.create": "automation.planner",\n  "automation.planner.reconcile": "automation.planner",\n  "automation.planner.retry": "automation.planner",\n  "automation.planner.status": "automation.planner",\n  "automation.planner.result": "automation.planner",\n});\n',
              'map neutral commands to capabilities')

          control = 'src/main/webgpt-control.ts'
          replace_once(control,
              'export type WebGptControlCommandName = WebGptCliCommandName | "webgpt.initialize" | "webgpt.planner.create" | "webgpt.planner.reconcile" | "webgpt.planner.retry" | "webgpt.planner.status" | "webgpt.planner.result";\n',
              'export type WebGptControlCommandName = typeof WEBGPT_CONTROL_COMMANDS[number];\n',
              'derive control command type from contract')
          replace_once(control,
              '  if (command === "webgpt.requirement.start" && (typeof record.projectId !== "string" || typeof record.webgptProjectId !== "string" || typeof record.providerTargetRef !== "string" || typeof record.goal !== "string")) return controlError("REQUIREMENT_START_REQUIRED", "requirement start 必须提供 projectId、webgptProjectId、providerTargetRef 和 goal。", command, requestId);\n  if (command === "webgpt.requirement.draft" && typeof record.requirementSessionId !== "string") return controlError("REQUIREMENT_SESSION_REQUIRED", "requirement draft 必须提供 sessionId。", command, requestId);\n  if (command === "webgpt.requirement.reconcile" && typeof record.requirementSessionId !== "string") return controlError("REQUIREMENT_SESSION_REQUIRED", "requirement reconcile 必须提供 sessionId。", command, requestId);\n',
              '  if (command === "webgpt.requirement.start" && (typeof record.projectId !== "string" || typeof record.webgptProjectId !== "string" || typeof record.providerTargetRef !== "string" || typeof record.goal !== "string")) return controlError("REQUIREMENT_START_REQUIRED", "requirement start 必须提供 projectId、webgptProjectId、providerTargetRef 和 goal。", command, requestId);\n  if (command === "automation.requirement.start" && (typeof record.projectId !== "string" || typeof record.providerTargetRef !== "string" || typeof record.goal !== "string")) return controlError("REQUIREMENT_START_REQUIRED", "automation requirement start 必须提供 projectId、providerTargetRef 和 goal。", command, requestId);\n  if ((command === "webgpt.requirement.draft" || command === "automation.requirement.draft") && typeof record.requirementSessionId !== "string") return controlError("REQUIREMENT_SESSION_REQUIRED", "requirement draft 必须提供 sessionId。", command, requestId);\n  if ((command === "webgpt.requirement.reconcile" || command === "automation.requirement.reconcile") && typeof record.requirementSessionId !== "string") return controlError("REQUIREMENT_SESSION_REQUIRED", "requirement reconcile 必须提供 sessionId。", command, requestId);\n',
              'validate neutral requirement commands')
          replace_once(control,
              '    "webgpt.planner.result": ["projectId", "actionIntentId"],\n  };\n',
              '    "webgpt.planner.result": ["projectId", "actionIntentId"],\n    "automation.requirement.start": ["projectId", "providerTargetRef", "goal"],\n    "automation.requirement.draft": ["requirementSessionId"],\n    "automation.requirement.reconcile": ["requirementSessionId", "requirementRoundId", "timeoutMs"],\n    "automation.planner.create": ["projectId", "providerTargetRef", "requirementVersionId", "operation", "priorPlanVersionId", "targetStageId", "planningConstraints", "inputRefs", "requestId", "idempotencyRef"],\n    "automation.planner.reconcile": ["projectId", "actionAttemptId"],\n    "automation.planner.retry": ["projectId", "actionIntentId", "logicalPlannerRequestId", "requirementVersionId", "plannerRequirementPayloadSha256", "policyVersionId"],\n    "automation.planner.status": ["projectId", "actionIntentId"],\n    "automation.planner.result": ["projectId", "actionIntentId"],\n  };\n',
              'allow neutral command fields')

          facade = 'src/main/automation-execution-facade.ts'
          replace_once(facade,
              'type PlannerRetryInput = Parameters<PlannerProviderIntegrationService["retryPlannerRequest"]>[0];\n',
              'type PlannerRetryInput = Parameters<PlannerProviderIntegrationService["retryPlannerRequest"]>[0];\ntype PlannerStatusInput = Parameters<PlannerProviderIntegrationService["plannerStatus"]>[0];\ntype PlannerResultInput = Parameters<PlannerProviderIntegrationService["plannerResult"]>[0];\n',
              'add planner query input types')
          replace_once(facade,
              '  async retryPlan(input: PlannerRetryInput, providerId?: AutomationProviderId | null) {\n    const logicalId = input.actionIntentId ?? input.logicalPlannerRequestId;\n    if (!logicalId) throw new AutomationExecutionRoutingError("AUTOMATION_PLANNER_INTENT_NOT_FOUND", "Planner retry has no logical request identity.");\n    const provider = await this.providerForPlannerIntent(logicalId, providerId);\n    return this.services.planner(provider).retryPlannerRequest(input);\n  }\n\n',
              '  async retryPlan(input: PlannerRetryInput, providerId?: AutomationProviderId | null) {\n    const logicalId = input.actionIntentId ?? input.logicalPlannerRequestId;\n    if (!logicalId) throw new AutomationExecutionRoutingError("AUTOMATION_PLANNER_INTENT_NOT_FOUND", "Planner retry has no logical request identity.");\n    const provider = await this.providerForPlannerIntent(logicalId, providerId);\n    return this.services.planner(provider).retryPlannerRequest(input);\n  }\n\n  async plannerStatus(input: PlannerStatusInput, providerId?: AutomationProviderId | null) {\n    const provider = await this.providerForPlannerIntent(input.actionIntentId, providerId);\n    return this.services.planner(provider).plannerStatus(input);\n  }\n\n  async plannerResult(input: PlannerResultInput, providerId?: AutomationProviderId | null) {\n    const provider = await this.providerForPlannerIntent(input.actionIntentId, providerId);\n    return this.services.planner(provider).plannerResult(input);\n  }\n\n',
              'add pure planner query facade methods')

          main = 'src/main/main.ts'
          marker = '    } else if (request.command === "webgpt.requirement.start") {\n'
          neutral = '    } else if (request.command === "automation.requirement.start") {\n      if (!request.projectId || !request.providerTargetRef || !request.goal) response = controlFail(request.command, "REQUIREMENT_START_REQUIRED", "automation requirement start 必须提供 Automation project、opaque provider target 和 goal。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.startRequirement({ projectId: request.projectId, goal: request.goal, questions: [], providerTargetRef: request.providerTargetRef }));\n    } else if (request.command === "automation.requirement.draft") {\n      if (!request.requirementSessionId) response = controlFail(request.command, "REQUIREMENT_SESSION_REQUIRED", "automation requirement draft 必须提供 sessionId。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.requestRequirementDraft({ sessionId: request.requirementSessionId }));\n    } else if (request.command === "automation.requirement.reconcile") {\n      if (!request.requirementSessionId) response = controlFail(request.command, "REQUIREMENT_SESSION_REQUIRED", "automation requirement reconcile 必须提供 sessionId。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.reconcileRequirement({ sessionId: request.requirementSessionId, ...(request.requirementRoundId ? { roundId: request.requirementRoundId } : {}), ...(request.timeoutMs === undefined ? {} : { waitTimeoutMs: request.timeoutMs }) }));\n    } else if (request.command === "automation.planner.create") {\n      if (!request.projectId || !request.providerTargetRef) response = controlFail(request.command, "PLANNER_CREATE_REQUIRED", "automation planner create 必须提供 Project ID 和 opaque provider target。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.createPlan({ projectId: request.projectId, providerTargetRef: request.providerTargetRef, ...(request.requirementVersionId ? { requirementVersionId: request.requirementVersionId } : {}), ...(request.operation ? { operation: request.operation } : {}), ...(request.priorPlanVersionId !== undefined ? { priorPlanVersionId: request.priorPlanVersionId } : {}), ...(request.targetStageId !== undefined ? { targetStageId: request.targetStageId } : {}), ...(request.planningConstraints ? { planningConstraints: request.planningConstraints } : {}), ...(request.inputRefs ? { inputRefs: request.inputRefs } : {}), ...(request.requestId ? { requestId: request.requestId } : {}), ...(request.idempotencyRef ? { idempotencyRef: request.idempotencyRef } : {}) }));\n    } else if (request.command === "automation.planner.reconcile") {\n      if (!request.projectId || !request.actionAttemptId) response = controlFail(request.command, "PLANNER_RECONCILE_REQUIRED", "automation planner reconcile 必须提供 Project ID 和 ActionAttempt ID。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.reconcilePlan({ projectId: request.projectId, actionAttemptId: request.actionAttemptId }));\n    } else if (request.command === "automation.planner.retry") {\n      if (!request.projectId || (!request.actionIntentId && !request.logicalPlannerRequestId) || (request.actionIntentId !== undefined && request.logicalPlannerRequestId !== undefined)) response = controlFail(request.command, "PLANNER_RETRY_REQUIRED", "automation planner retry 必须提供 Project ID 和恰好一个 Planner logical request identity。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.retryPlan({ projectId: request.projectId, ...(request.actionIntentId ? { actionIntentId: request.actionIntentId } : {}), ...(request.logicalPlannerRequestId ? { logicalPlannerRequestId: request.logicalPlannerRequestId } : {}), ...(request.requirementVersionId ? { requirementVersionId: request.requirementVersionId } : {}), ...(request.plannerRequirementPayloadSha256 ? { requirementPayloadSha256: request.plannerRequirementPayloadSha256 } : {}), ...(request.policyVersionId ? { policyVersionId: request.policyVersionId } : {}) }));\n    } else if (request.command === "automation.planner.status") {\n      if (!request.projectId || !request.actionIntentId) response = controlFail(request.command, "PLANNER_QUERY_REQUIRED", "automation planner status 必须提供 Project ID 和 ActionIntent ID。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.plannerStatus({ projectId: request.projectId, actionIntentId: request.actionIntentId }));\n    } else if (request.command === "automation.planner.result") {\n      if (!request.projectId || !request.actionIntentId) response = controlFail(request.command, "PLANNER_QUERY_REQUIRED", "automation planner result 必须提供 Project ID 和 ActionIntent ID。");\n      else response = controlOk(request.command, await getAutomationProviderHost().execution.plannerResult({ projectId: request.projectId, actionIntentId: request.actionIntentId }));\n'
          replace_once(main, marker, neutral + marker, 'insert neutral production command routing')

          test_path = Path('tests/arch-r2-automation-control-plane.test.ts')
          if test_path.exists():
              raise SystemExit('new ARCH-R2 automation control test already exists')
          lines = [
              'import assert from "node:assert/strict";',
              'import { readFile } from "node:fs/promises";',
              'import test from "node:test";',
              'import { parseWebGptControlRequest, WEBGPT_CONTROL_PROTOCOL_VERSION } from "../src/main/webgpt-control.ts";',
              'import { CONTROL_PLANE_CAPABILITIES, WEBGPT_CONTROL_COMMANDS, requiredControlPlaneCapability } from "../src/shared/webgpt-control-plane-contract.ts";',
              '',
              'test("ARCH-R2 exposes provider-neutral automation commands without changing explicit webgpt commands", () => {',
              '  for (const command of ["automation.requirement.start", "automation.requirement.draft", "automation.requirement.reconcile", "automation.planner.create", "automation.planner.reconcile", "automation.planner.retry", "automation.planner.status", "automation.planner.result"] as const) assert.equal(WEBGPT_CONTROL_COMMANDS.includes(command), true);',
              '  assert.equal(requiredControlPlaneCapability("automation.requirement.start"), "automation.requirement");',
              '  assert.equal(requiredControlPlaneCapability("automation.planner.create"), "automation.planner");',
              '  assert.equal(requiredControlPlaneCapability("webgpt.requirement.start"), "webgpt.requirement");',
              '  assert.equal(requiredControlPlaneCapability("webgpt.planner.create"), "webgpt.planner");',
              '  assert.equal(CONTROL_PLANE_CAPABILITIES.some((item) => item.name === "automation.requirement" && item.status === "STABLE"), true);',
              '  assert.equal(CONTROL_PLANE_CAPABILITIES.some((item) => item.name === "automation.planner" && item.status === "STABLE"), true);',
              '});',
              '',
              'test("ARCH-R2 automation Requirement start accepts a Native opaque target without WebGPT project identity", () => {',
              '  const parsed = parseWebGptControlRequest({ version: WEBGPT_CONTROL_PROTOCOL_VERSION, requestId: "automation-requirement-1", command: "automation.requirement.start", projectId: "automation-project", providerTargetRef: "native-thread-v1:thread-123", goal: "Plan with Native by default" });',
              '  assert.deepEqual(parsed, { version: WEBGPT_CONTROL_PROTOCOL_VERSION, requestId: "automation-requirement-1", command: "automation.requirement.start", projectId: "automation-project", providerTargetRef: "native-thread-v1:thread-123", goal: "Plan with Native by default" });',
              '  const wrongLegacyShape = parseWebGptControlRequest({ version: WEBGPT_CONTROL_PROTOCOL_VERSION, requestId: "webgpt-requirement-legacy", command: "webgpt.requirement.start", projectId: "automation-project", providerTargetRef: "native-thread-v1:thread-123", goal: "x" });',
              '  assert.equal("error" in wrongLegacyShape && wrongLegacyShape.error?.code, "REQUIREMENT_START_REQUIRED");',
              '});',
              '',
              'test("ARCH-R2 automation Planner query commands are allowlisted as pure query inputs", () => {',
              '  const status = parseWebGptControlRequest({ version: 1, requestId: "automation-planner-status-1", command: "automation.planner.status", projectId: "project-a", actionIntentId: "intent-a" });',
              '  assert.deepEqual(status, { version: 1, requestId: "automation-planner-status-1", command: "automation.planner.status", projectId: "project-a", actionIntentId: "intent-a" });',
              '  const result = parseWebGptControlRequest({ version: 1, requestId: "automation-planner-result-1", command: "automation.planner.result", projectId: "project-a", actionIntentId: "intent-a" });',
              '  assert.deepEqual(result, { version: 1, requestId: "automation-planner-result-1", command: "automation.planner.result", projectId: "project-a", actionIntentId: "intent-a" });',
              '});',
              '',
              'test("ARCH-R2 production main routes neutral commands through AutomationExecutionFacade while legacy webgpt stays explicit", async () => {',
              '  const main = await readFile(new URL("../src/main/main.ts", import.meta.url), "utf8");',
              '  assert.match(main, /request\.command === "automation\.requirement\.start"/);',
              '  assert.match(main, /execution\.startRequirement/);',
              '  assert.match(main, /request\.command === "automation\.planner\.create"/);',
              '  assert.match(main, /execution\.createPlan/);',
              '  assert.match(main, /request\.command === "webgpt\.requirement\.start"/);',
              '  assert.match(main, /getRequirementAutomationService\(\)\.startAlignment/);',
              '  assert.match(main, /getAutomationProviderHost\(\)\.composition\.services\.requirement\("WEBGPT"\)/);',
              '});',
              '',
          ]
          test_path.write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Enforce allowed files and bounded diffs
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              src/shared/webgpt-control-plane-contract.ts|src/main/webgpt-control.ts|src/main/automation-execution-facade.ts|src/main/main.ts|tests/arch-r2-automation-control-plane.test.ts) ;;
              *) echo "unexpected changed file: $path"; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 5
          while read -r adds dels path; do
            test "$adds" != "-" && test "$dels" != "-"
            test "$adds" -le 120
            test "$dels" -le 80
            echo "$path: +$adds -$dels"
          done < <(git diff --numstat)
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arch-r2-automation-control-cutover.yml
          git add src/shared/webgpt-control-plane-contract.ts src/main/webgpt-control.ts src/main/automation-execution-facade.ts src/main/main.ts tests/arch-r2-automation-control-plane.test.ts
          git commit -m "feat(arch-r2): expose Native-default automation control path"
          git push origin HEAD:arch-r2/provider-execution-boundary
      - name: Dispatch exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref arch-r2/provider-execution-boundary
