name: v0.1 Windows Trial Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.1-integration
    paths:
      - .github/workflows/v01-package-candidate.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PRODUCT_SNAPSHOT: a2ad45a4a54aca3ca9d069afa2c5c412ac615471
    steps:
      - name: Checkout frozen workspace-write product snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SNAPSHOT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare Electron Windows runtime
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '0'
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path 'node_modules/electron/dist')) {
            throw 'Electron Windows runtime was not installed.'
          }
      - name: Build Windows package
        run: npm run package:win
      - name: Verify trial package layout and record provenance
        shell: pwsh
        run: |
          $required = @(
            'dist/package/Codex Workbench V1.exe',
            'dist/package/Codex Workbench CLI.exe',
            'dist/package/Codex Workbench CLI Runtime.exe',
            'dist/package/resources/app/package.json',
            'dist/package/resources/app/dist/main/main.js',
            'dist/package/resources/app/dist/main/native-provider-runtime-adapter.js',
            'dist/package/resources/app/dist/main/automation-provider-host.js',
            'dist/package/resources/app/dist/automation/v01-workspace-write-contract.js',
            'dist/package/resources/app/dist/automation/requirement-response-repair.js',
            'dist/package/resources/app/dist/automation/requirement-service.js',
            'dist/package/resources/app/dist/automation/requirement-projection-service.js',
            'dist/package/resources/app/dist/automation/planner-provider-integration.js',
            'dist/package/resources/app/dist/automation/planner-provider-prompt.js',
            'dist/package/resources/app/dist/codex/automation/native-provider-port.js',
            'dist/package/resources/app/dist/renderer/ui-projection.js',
            'dist/package/resources/app/dist/renderer/automation-governance-inspector.js',
            'dist/package/resources/app/dist/renderer/automation-governance-actions.js',
            'dist/package/resources/app/dist/renderer/automation-requirement-planner.js',
            'dist/package/resources/app/dist/renderer/planner-operation-progress.js',
            'dist/package/resources/app/dist/renderer/planner-restart-recovery.js',
            'dist/package/resources/app/dist/renderer/automation-v01-guidance.js',
            'dist/package/resources/app/dist/renderer/automation-ui-zh.js'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaged artifact: $path" }
          }

          $workspaceWriteContractPath = 'dist/package/resources/app/dist/automation/v01-workspace-write-contract.js'
          $workspaceWriteContract = Get-Content $workspaceWriteContractPath -Raw
          if (-not $workspaceWriteContract.Contains('USER_CONFIRMED')) {
            throw 'Packaged workspace-write contract is missing durable user confirmation authority.'
          }
          if (-not $workspaceWriteContract.Contains('WORKSPACE_WRITE')) {
            throw 'Packaged workspace-write contract is missing bounded workspace-write disposition.'
          }

          $requirementServicePath = 'dist/package/resources/app/dist/automation/requirement-service.js'
          $requirementService = Get-Content $requirementServicePath -Raw
          if (-not $requirementService.Contains('./requirement-response-repair.js')) {
            throw 'Packaged Requirement service is missing bounded response repair import.'
          }
          if ($requirementService.Contains('./requirement-response-repair.ts')) {
            throw 'Packaged Requirement service still references source-only response repair module.'
          }

          $plannerProjectionPath = 'dist/package/resources/app/dist/automation/requirement-projection-service.js'
          $plannerProjection = Get-Content $plannerProjectionPath -Raw
          if (-not $plannerProjection.Contains('plannerRecovery')) {
            throw 'Packaged Requirement projection is missing Planner restart recovery projection.'
          }
          if (-not $plannerProjection.Contains('PLANNER_REQUEST')) {
            throw 'Packaged Requirement projection is missing persisted Planner ActionIntent binding.'
          }
          if (-not $plannerProjection.Contains('plannerRequirementVersionId')) {
            throw 'Packaged Requirement projection is missing active RequirementVersion Planner binding.'
          }

          $plannerIntegrationPath = 'dist/package/resources/app/dist/automation/planner-provider-integration.js'
          $plannerIntegration = Get-Content $plannerIntegrationPath -Raw
          if (-not $plannerIntegration.Contains('resolveRequestByCorrelation')) {
            throw 'Packaged Planner integration is missing read-only request identity recovery.'
          }
          if (-not $plannerIntegration.Contains('REQUEST_RECOVERY_LOOKUP_FAILED')) {
            throw 'Packaged Planner integration is missing bounded request recovery failure classification.'
          }
          if (-not $plannerIntegration.Contains('latestAttemptForIntent')) {
            throw 'Packaged Planner integration is missing latest-attempt recovery selection.'
          }
          if (-not $plannerIntegration.Contains('V01_MAX_PLANNER_PROVIDER_ATTEMPTS = 2')) {
            throw 'Packaged Planner integration is missing the quota-safe two-attempt ceiling.'
          }

          $plannerHostPath = 'dist/package/resources/app/dist/main/automation-provider-host.js'
          $plannerHost = Get-Content $plannerHostPath -Raw
          if (($plannerHost -notmatch 'V01_INTERACTIVE_PROVIDER_WAIT_CAP_MS\s*=\s*120_?000')) {
            throw 'Packaged Planner host is missing the 120 second interactive provider wait.'
          }

          if (-not $plannerProjection.Contains('attemptsRemaining')) {
            throw 'Packaged Requirement projection is missing remaining model-call visibility.'
          }
          if (-not $plannerProjection.Contains('resultClassification')) {
            throw 'Packaged Requirement projection is missing Planner result classification.'
          }

          $plannerRendererPath = 'dist/package/resources/app/dist/renderer/automation-requirement-planner.js'
          $plannerRenderer = Get-Content $plannerRendererPath -Raw
          if (-not $plannerRenderer.Contains('Retry 会新增一次模型调用')) {
            throw 'Packaged Planner UI is missing the explicit retry quota warning.'
          }
          if (-not $plannerRenderer.Contains('不新增调用')) {
            throw 'Packaged Planner UI is missing no-new-call action labels.'
          }
          if (-not $plannerRenderer.Contains('INVALID_OUTPUT_RETRYABLE')) {
            throw 'Packaged Planner UI is missing conditional retry classification.'
          }

          $nativeProviderPath = 'dist/package/resources/app/dist/codex/automation/native-provider-port.js'
          $nativeProvider = Get-Content $nativeProviderPath -Raw
          if (-not $nativeProvider.Contains('resolveTurnByPromptSha256')) {
            throw 'Packaged Native provider is missing read-only existing-Turn recovery.'
          }
          if (-not $nativeProvider.Contains('automation-input-v1:')) {
            throw 'Packaged Native provider is missing exact Automation input identity decoding.'
          }

          $nativeRuntimeAdapterPath = 'dist/package/resources/app/dist/main/native-provider-runtime-adapter.js'
          $nativeRuntimeAdapter = Get-Content $nativeRuntimeAdapterPath -Raw
          if (-not $nativeRuntimeAdapter.Contains('resolveTurnByPromptSha256')) {
            throw 'Packaged Native runtime adapter is missing prompt-hash Turn recovery.'
          }
          if (-not $nativeRuntimeAdapter.Contains('excludeTurnIds')) {
            throw 'Packaged Native runtime adapter is missing prior-attempt exclusion handling.'
          }
          if (-not $nativeRuntimeAdapter.Contains('userMessage')) {
            throw 'Packaged Native runtime adapter is missing exact user prompt matching.'
          }
          if (-not $nativeRuntimeAdapter.Contains('resolveTurnPreferences')) {
            throw 'Packaged Native runtime adapter is missing Thread model preference inheritance.'
          }

          $plannerPromptPath = 'dist/package/resources/app/dist/automation/planner-provider-prompt.js'
          $plannerPrompt = Get-Content $plannerPromptPath -Raw
          $verificationClasses = @(
            'BUILD',
            'TEST',
            'GIT_DIFF',
            'GIT_STATUS',
            'FILE_EXISTS',
            'HASH_MATCH',
            'JSON_SCHEMA',
            'CLI_SMOKE',
            'HARDWARE_SMOKE',
            'CUSTOM_APPROVED'
          )
          foreach ($verificationClass in $verificationClasses) {
            if (-not $plannerPrompt.Contains($verificationClass)) {
              throw "Packaged Planner prompt is missing verificationClass: $verificationClass"
            }
          }
          if (-not $plannerPrompt.Contains('Never invent, translate, or emit any other verificationClass value.')) {
            throw 'Packaged Planner prompt is missing strict verificationClass guidance.'
          }

          $projectionPath = 'dist/package/resources/app/dist/renderer/ui-projection.js'
          $projection = Get-Content $projectionPath -Raw
          $requiredImports = @(
            './automation-governance-inspector.js',
            './automation-governance-actions.js',
            './automation-requirement-planner.js',
            './planner-operation-progress.js',
            './planner-restart-recovery.js',
            './automation-v01-guidance.js',
            './automation-ui-zh.js'
          )
          foreach ($specifier in $requiredImports) {
            if (-not $projection.Contains($specifier)) {
              throw "Packaged UI projection is missing dynamic import: $specifier"
            }
          }
          $forbiddenImports = @(
            './automation-governance-inspector.ts',
            './automation-governance-actions.ts',
            './automation-requirement-planner.ts',
            './planner-operation-progress.ts',
            './planner-restart-recovery.ts',
            './automation-v01-guidance.ts',
            './automation-ui-zh.ts'
          )
          foreach ($specifier in $forbiddenImports) {
            if ($projection.Contains($specifier)) {
              throw "Packaged UI projection still references source-only module: $specifier"
            }
          }

          $restartRecoveryPath = 'dist/package/resources/app/dist/renderer/planner-restart-recovery.js'
          $restartRecovery = Get-Content $restartRecoveryPath -Raw
          if (-not $restartRecovery.Contains('plannerRecovery')) {
            throw 'Packaged Planner restart recovery UI is missing bounded recovery projection handling.'
          }
          if (-not $restartRecovery.Contains('retryAutomationPlan')) {
            throw 'Packaged Planner restart recovery UI is missing exact-intent retry handling.'
          }
          if ($restartRecovery.Contains('createAutomationPlan')) {
            throw 'Packaged Planner restart recovery UI must not create a new Planner intent.'
          }

          $guiSha = (Get-FileHash 'dist/package/Codex Workbench V1.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $cliSha = (Get-FileHash 'dist/package/Codex Workbench CLI.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            'Codex Workbench v0.1 Windows trial candidate',
            "productSnapshot=$env:PRODUCT_SNAPSHOT",
            "guiSha256=$guiSha",
            "cliSha256=$cliSha",
            'packagedAutomationModelPreference=PASS',
            'packagedWorkspaceWriteContract=PASS',
            'packagedRequirementResponseRepair=PASS',
            'packagedPlannerVerificationContract=PASS',
            'packagedPlannerRestartRecovery=PASS',
            'packagedPlannerRequestIdentityRecovery=PASS',
            'packagedPlannerQuotaSafeRecovery=PASS',
            'packagedAutomationUiContract=PASS',
            'note=Candidate packaging artifact only; current real Source and packaged E2E gates remain separately required.'
          ) | Set-Content 'dist/package/CANDIDATE_PROVENANCE.txt' -Encoding utf8
          Get-Content 'dist/package/CANDIDATE_PROVENANCE.txt'
      - name: Upload Windows trial candidate
        uses: actions/upload-artifact@v4
        with:
          name: codex-workbench-v0.1-windows-${{ env.PRODUCT_SNAPSHOT }}
          path: dist/package
          if-no-files-found: error
          retention-days: 14
