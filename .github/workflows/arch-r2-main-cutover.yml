name: ARCH-R2 main cutover patch

on:
  push:
    branches:
      - arch-r2/provider-execution-boundary
    paths:
      - .github/workflows/arch-r2-main-cutover.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch-r2/provider-execution-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact main-process cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/main.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { RequirementAutomationService } from "../automation/requirement-service.ts";\n',
              '',
              'remove legacy Requirement constructor import',
          )
          replace_once(
              'import { createPlannerProviderIntegrationService, type PlannerProviderIntegrationService } from "../automation/planner-provider-integration.ts";\n',
              '',
              'remove legacy Planner constructor import',
          )
          replace_once(
              'import { createStartupPlan, runStartupPlan } from "./startup-policy.ts";\n',
              'import { createStartupPlan, runStartupPlan } from "./startup-policy.ts";\nimport { createAutomationProviderHost, type AutomationProviderHost } from "./automation-provider-host.ts";\n',
              'add provider host import',
          )
          replace_once(
              'let webGptProviderPort: WebGptAutomationProviderPort | null = null;\nlet requirementAutomationService: RequirementAutomationService | null = null;\nlet plannerProviderIntegrationService: PlannerProviderIntegrationService | null = null;\n',
              'let webGptProviderPort: WebGptAutomationProviderPort | null = null;\nlet automationProviderHost: AutomationProviderHost | null = null;\n',
              'replace direct service singletons',
          )
          replace_once(
              '    getWebGptProviderPort();\n    getRequirementAutomationService();\n    getPlannerProviderIntegrationService();\n',
              '    getAutomationProviderHost();\n',
              'materialize provider host',
          )
          marker = '''  return webGptProviderPort;\n}\n\n/**\n * Active Requirement production composition.  This is the only main-process\n'''
          replacement = '''  return webGptProviderPort;\n}\n\n/**\n * Native-first production Automation composition. The host consumes only the\n * already-owned RuntimeRegistry and registers WebGPT as an explicit optional\n * provider; it never creates a second Native runtime trunk.\n */\nfunction getAutomationProviderHost(): AutomationProviderHost {\n  if (automationProviderHost) return automationProviderHost;\n  if (!automationStore) throw new Error("AUTOMATION_STORE_REQUIRED");\n  automationProviderHost = createAutomationProviderHost({\n    store: automationStore,\n    inputRefs: automationInputRefs,\n    nativeRuntimes: runtimes,\n    nativeRuntimeId: workbenchInstanceId,\n    webgptProvider: getWebGptProviderPort(),\n  });\n  return automationProviderHost;\n}\n\n/**\n * Legacy webgpt.* Requirement commands stay explicitly pinned to WebGPT.\n * Provider-neutral work uses AutomationExecutionFacade, whose default is Native.\n */\n'''
          replace_once(marker, replacement, 'insert provider host')

          old_requirement = '''function getRequirementAutomationService(): RequirementAutomationService {\n  if (requirementAutomationService) return requirementAutomationService;\n  if (!automationStore) throw new Error("AUTOMATION_STORE_REQUIRED");\n  requirementAutomationService = new RequirementAutomationService({\n    store: automationStore,\n    provider: getWebGptProviderPort(),\n    inputRefs: automationInputRefs,\n  });\n  return requirementAutomationService;\n}\n\n/**\n * Production Planner composition uses the same provider port and policy/\n * InputRef boundaries as Requirement dispatch. The legacy WebGPT Planner\n * service is intentionally not constructed here.\n */\nfunction getPlannerProviderIntegrationService(): PlannerProviderIntegrationService {\n  if (plannerProviderIntegrationService) return plannerProviderIntegrationService;\n  if (!automationStore) throw new Error("AUTOMATION_STORE_REQUIRED");\n  plannerProviderIntegrationService = createPlannerProviderIntegrationService({ store: automationStore, provider: getWebGptProviderPort() });\n  return plannerProviderIntegrationService;\n}\n'''
          new_requirement = '''function getRequirementAutomationService() {\n  return getAutomationProviderHost().composition.services.requirement("WEBGPT");\n}\n\n/** Legacy webgpt.* Planner commands stay explicitly pinned to WebGPT. */\nfunction getPlannerProviderIntegrationService() {\n  return getAutomationProviderHost().composition.services.planner("WEBGPT");\n}\n'''
          replace_once(old_requirement, new_requirement, 'route legacy WebGPT services through host')
          replace_once(
              '          webGptProviderPort = null;\n          webGptExternalActionBridge = null;\n',
              '          webGptProviderPort = null;\n          automationProviderHost = null;\n          webGptExternalActionBridge = null;\n',
              'clear provider host on shutdown',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Enforce bounded diff
        shell: bash
        run: |
          git diff --check
          read adds dels path <<<"$(git diff --numstat -- src/main/main.ts)"
          test "$path" = "src/main/main.ts"
          test "$adds" -le 80
          test "$dels" -le 80
          echo "main.ts diff: +$adds -$dels"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit cutover and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arch-r2-main-cutover.yml
          git add src/main/main.ts
          git commit -m "refactor(arch-r2): cut production automation over to provider host"
          git push origin HEAD:arch-r2/provider-execution-boundary
      - name: Dispatch exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref arch-r2/provider-execution-boundary
