name: ARCH-R2 main cutover patch

on:
  push:
    branches:
      - arch-r2/provider-execution-boundary
    paths:
      - .github/workflows/arch-r2-main-cutover.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arch-r2/provider-execution-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact main-process cutover
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/main/main.ts')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'import { RequirementAutomationService } from "../automation/requirement-service.ts";\n',
              '',
              'remove legacy Requirement constructor import',
          )
          replace_once(
              'import { createPlannerProviderIntegrationService, type PlannerProviderIntegrationService } from "../automation/planner-provider-integration.ts";\n',
              '',
              'remove legacy Planner constructor import',
          )
          replace_once(
              'import { createStartupPlan, runStartupPlan } from "./startup-policy.ts";\n',
              'import { createStartupPlan, runStartupPlan } from "./startup-policy.ts";\nimport { createAutomationProviderHost, type AutomationProviderHost } from "./automation-provider-host.ts";\n',
              'add provider host import',
          )
          replace_once(
              'let webGptProviderPort: WebGptAutomationProviderPort | null = null;\nlet requirementAutomationService: RequirementAutomationService | null = null;\nlet plannerProviderIntegrationService: PlannerProviderIntegrationService | null = null;\n',
              'let webGptProviderPort: WebGptAutomationProviderPort | null = null;\nlet automationProviderHost: AutomationProviderHost | null = null;\n',
              'replace direct service singletons',
          )
          replace_once(
              '    getWebGptProviderPort();\n    getRequirementAutomationService();\n    getPlannerProviderIntegrationService();\n',
              '    getAutomationProviderHost();\n',
              'materialize provider host',
          )

          old_comment = '''/**
 * Active Requirement production composition.  This is the only main-process
 * caller that creates RequirementAutomationService for live execution: it
 * shares the same provider port and process-owned InputRef registry, so an
 * opaque input reference cannot be resolved by a second, unrelated registry.
 * The paused AUT-2/AUT-3 harnesses remain legacy/test-only and are not routed
 * through this service.
 */
'''
          new_comment = '''/**
 * Native-first production Automation composition. The host consumes only the
 * already-owned RuntimeRegistry and registers WebGPT as an explicit optional
 * provider; it never creates a second Native runtime trunk.
 */
function getAutomationProviderHost(): AutomationProviderHost {
  if (automationProviderHost) return automationProviderHost;
  if (!automationStore) throw new Error("AUTOMATION_STORE_REQUIRED");
  automationProviderHost = createAutomationProviderHost({
    store: automationStore,
    inputRefs: automationInputRefs,
    nativeRuntimes: runtimes,
    nativeRuntimeId: workbenchInstanceId,
    webgptProvider: getWebGptProviderPort(),
  });
  return automationProviderHost;
}

/** Legacy webgpt.* Requirement commands stay explicitly pinned to WebGPT. */
'''
          replace_once(old_comment, new_comment, 'replace requirement composition comment with provider host')

          old_requirement = '''function getRequirementAutomationService(): RequirementAutomationService {
  if (requirementAutomationService) return requirementAutomationService;
  if (!automationStore) throw new Error("AUTOMATION_STORE_REQUIRED");
  requirementAutomationService = new RequirementAutomationService({
    store: automationStore,
    provider: getWebGptProviderPort(),
    inputRefs: automationInputRefs,
  });
  return requirementAutomationService;
}

/**
 * Production Planner composition uses the same provider port and policy/
 * InputRef boundaries as Requirement dispatch. The legacy WebGPT Planner
 * service is intentionally not constructed here.
 */
function getPlannerProviderIntegrationService(): PlannerProviderIntegrationService {
  if (plannerProviderIntegrationService) return plannerProviderIntegrationService;
  if (!automationStore) throw new Error("AUTOMATION_STORE_REQUIRED");
  plannerProviderIntegrationService = createPlannerProviderIntegrationService({ store: automationStore, provider: getWebGptProviderPort() });
  return plannerProviderIntegrationService;
}
'''
          new_requirement = '''function getRequirementAutomationService() {
  return getAutomationProviderHost().composition.services.requirement("WEBGPT");
}

/** Legacy webgpt.* Planner commands stay explicitly pinned to WebGPT. */
function getPlannerProviderIntegrationService() {
  return getAutomationProviderHost().composition.services.planner("WEBGPT");
}
'''
          replace_once(old_requirement, new_requirement, 'route legacy WebGPT services through host')
          replace_once(
              '          webGptProviderPort = null;\n          webGptExternalActionBridge = null;\n',
              '          webGptProviderPort = null;\n          automationProviderHost = null;\n          webGptExternalActionBridge = null;\n',
              'clear provider host on shutdown',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Enforce bounded diff
        shell: bash
        run: |
          git diff --check
          read adds dels path <<<"$(git diff --numstat -- src/main/main.ts)"
          test "$path" = "src/main/main.ts"
          test "$adds" -le 80
          test "$dels" -le 80
          echo "main.ts diff: +$adds -$dels"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit cutover and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/arch-r2-main-cutover.yml
          git add src/main/main.ts
          git commit -m "refactor(arch-r2): cut production automation over to provider host"
          git push origin HEAD:arch-r2/provider-execution-boundary
      - name: Dispatch exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run ci.yml --ref arch-r2/provider-execution-boundary
