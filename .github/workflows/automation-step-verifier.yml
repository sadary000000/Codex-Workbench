name: Automation Step Verifier Gate

on:
  push:
    branches:
      - feature/automation-step-verifier

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff and verifier boundary guard
        shell: bash
        run: |
          set -euo pipefail
          base='f26e9700525e4095541e206016d77a7f6caaf2f4'
          allowed='^(src/automation/step-verification-service\.ts|src/main/automation-execution-facade\.ts|tests/automation-step-verifier\.test\.ts|\.github/workflows/automation-step-verifier\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded Step verifier slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in src/automation/step-verification-service.ts src/main/automation-execution-facade.ts tests/automation-step-verifier.test.ts .github/workflows/automation-step-verifier.yml; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required verifier diff: $required" >&2; exit 1; }
          done
          if grep -Eq 'from "\./adapters\.ts"|from "\.\./.*codex/|startTurn\(|\.submit\(' src/automation/step-verification-service.ts; then
            echo 'Step verifier must not import provider/runtime execution seams or dispatch work.' >&2
            exit 1
          fi
          grep -F 'policy.verificationClass !== "HASH_MATCH"' src/automation/step-verification-service.ts >/dev/null
          grep -F 'result-sha256:' src/automation/step-verification-service.ts >/dev/null
          git diff --check "$base"...HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Step verifier tests
        run: node --experimental-strip-types --test tests/automation-step-verifier.test.ts tests/automation-native-step-executor.test.ts tests/automation-step-verification-contract.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Self-clean validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-step-verifier.yml
          git commit -m 'test: remove deterministic Step verifier gate'
          git push origin HEAD:feature/automation-step-verifier
