name: Automation Step Verifier Gate

on:
  push:
    branches:
      - feature/automation-step-verifier

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff guard
        shell: bash
        run: |
          set -euo pipefail
          base='f26e9700525e4095541e206016d77a7f6caaf2f4'
          allowed='^(src/automation/step-verification-service\.ts|src/main/automation-execution-facade\.ts|tests/automation-step-verifier\.test\.ts|\.github/workflows/automation-step-verifier\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded Step verifier slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in tests/automation-step-verifier.test.ts .github/workflows/automation-step-verifier.yml; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required initial diff: $required" >&2; exit 1; }
          done

      - name: Apply exact Step verifier product patch
        shell: bash
        run: |
          set -euo pipefail
          cat > src/automation/step-verification-service.ts <<'EOF'
          import { canonicalize, sha256Hex } from "./canonical.ts";
          import { AutomationStore } from "./store.ts";
          import type {
            ActionAttempt,
            ActionIntent,
            ActionReceipt,
            AutomationDocument,
            Evidence,
            ExternalRef,
            PlanVersion,
            PlannerVerificationClass,
            StepRuntime,
            StepSpec,
          } from "./types.ts";

          const STEP_VERIFIER_PROTOCOL = "workbench-step-verifier-v1" as const;
          const STEP_VERIFICATION_EVIDENCE = "STEP_VERIFICATION" as const;
          const STEP_VERIFICATION_SOURCE = "WORKFLOW_TRUTH" as const;
          const SHA256 = /^[a-f0-9]{64}$/;
          const HASH_MATCH_PLAN = /^result-sha256:([a-f0-9]{64})$/;
          const VERIFICATION_CLASSES = new Set<PlannerVerificationClass>([
            "BUILD",
            "TEST",
            "GIT_DIFF",
            "GIT_STATUS",
            "FILE_EXISTS",
            "HASH_MATCH",
            "JSON_SCHEMA",
            "CLI_SMOKE",
            "HARDWARE_SMOKE",
            "CUSTOM_APPROVED",
          ]);

          export type StepVerificationStatus =
            | "REVIEWING"
            | "FAILED"
            | "POLICY_MISSING"
            | "POLICY_INVALID"
            | "UNSUPPORTED_CLASS"
            | "NOT_READY";

          export interface VerifyStepInput {
            readonly projectId: string;
            readonly executionAttemptId: string;
          }

          export interface StepVerificationResult {
            readonly status: StepVerificationStatus;
            readonly projectId: string;
            readonly stageSpecId: string;
            readonly stepSpecId: string;
            readonly stepRuntimeId: string;
            readonly executionAttemptId: string;
            readonly planVersionId: string;
            readonly verificationClass: PlannerVerificationClass | null;
            readonly verificationEvidenceId: string | null;
            readonly expectedHash: string | null;
            readonly observedHash: string | null;
            readonly reason: string | null;
          }

          export class StepVerificationError extends Error {
            readonly code:
              | "STEP_VERIFICATION_PROJECT_NOT_FOUND"
              | "STEP_VERIFICATION_ATTEMPT_NOT_FOUND"
              | "STEP_VERIFICATION_CORRELATION_MISMATCH"
              | "STEP_VERIFICATION_PLAN_NOT_ACTIVE"
              | "STEP_VERIFICATION_PLAN_TRUTH_INVALID"
              | "STEP_VERIFICATION_NOT_VERIFYING";

            constructor(code: StepVerificationError["code"], message: string) {
              super(message);
              this.name = "StepVerificationError";
              this.code = code;
            }
          }

          interface VerificationPolicy {
            readonly verificationClass: PlannerVerificationClass;
            readonly verificationPlan: readonly string[];
            readonly expectedArtifacts: readonly string[];
          }

          type PolicyRead =
            | { readonly status: "OK"; readonly policy: VerificationPolicy }
            | { readonly status: "MISSING"; readonly reason: string }
            | { readonly status: "INVALID"; readonly verificationClass: PlannerVerificationClass | null; readonly reason: string };

          function record(value: unknown): Record<string, unknown> | null {
            return value !== null && typeof value === "object" && !Array.isArray(value) ? value as Record<string, unknown> : null;
          }

          function stringList(value: unknown): readonly string[] | null {
            if (!Array.isArray(value) || value.some((item) => typeof item !== "string")) return null;
            return value as string[];
          }

          function readPolicy(plan: PlanVersion, step: StepSpec): PolicyRead {
            if (!plan.canonicalPayload || !plan.payloadSha256) {
              return { status: "MISSING", reason: "The active PlanVersion predates structured verifier policy truth." };
            }
            if (sha256Hex(plan.canonicalPayload) !== plan.payloadSha256) {
              throw new StepVerificationError("STEP_VERIFICATION_PLAN_TRUTH_INVALID", "PlanVersion canonicalPayload hash does not match payloadSha256.");
            }
            let parsed: unknown;
            try {
              parsed = JSON.parse(plan.canonicalPayload);
            } catch {
              throw new StepVerificationError("STEP_VERIFICATION_PLAN_TRUTH_INVALID", "PlanVersion canonicalPayload is not valid JSON.");
            }
            const root = record(parsed);
            const steps = root && Array.isArray(root.steps) ? root.steps : null;
            if (!steps) throw new StepVerificationError("STEP_VERIFICATION_PLAN_TRUTH_INVALID", "PlanVersion canonicalPayload has no Step candidates.");
            const entry = steps.map(record).find((item) => item?.stepSpecId === step.stepSpecId) ?? null;
            if (!entry || entry.stageSpecId !== step.stageSpecId || entry.stepKey !== step.stepKey || entry.specVersion !== step.specVersion) {
              throw new StepVerificationError("STEP_VERIFICATION_PLAN_TRUTH_INVALID", "Persisted verifier policy does not correlate to the exact StepSpec identity.");
            }
            const hasDescriptor = entry.verificationClass !== undefined || entry.verificationPlan !== undefined || entry.expectedArtifacts !== undefined;
            if (!hasDescriptor) return { status: "MISSING", reason: "The exact Step has no persisted verifier descriptor." };
            const verificationClass = typeof entry.verificationClass === "string" && VERIFICATION_CLASSES.has(entry.verificationClass as PlannerVerificationClass)
              ? entry.verificationClass as PlannerVerificationClass
              : null;
            const verificationPlan = stringList(entry.verificationPlan);
            const expectedArtifacts = entry.expectedArtifacts === undefined ? [] : stringList(entry.expectedArtifacts);
            if (!verificationClass || !verificationPlan || verificationPlan.length === 0 || !expectedArtifacts) {
              return { status: "INVALID", verificationClass, reason: "The persisted verifier descriptor is incomplete or malformed." };
            }
            return { status: "OK", policy: { verificationClass, verificationPlan, expectedArtifacts } };
          }

          function policySha256(policy: VerificationPolicy): string {
            return sha256Hex(canonicalize({
              expectedArtifacts: [...policy.expectedArtifacts],
              verificationClass: policy.verificationClass,
              verificationPlan: [...policy.verificationPlan],
            }, "stepVerificationPolicy"));
          }

          function actionForAttempt(document: AutomationDocument, executionAttemptId: string): ActionIntent | null {
            return document.actionIntents.find((item) => item.actionType === "STEP_EXECUTION" && item.attemptId === executionAttemptId) ?? null;
          }

          function latestActionAttempt(document: AutomationDocument, intentId: string): ActionAttempt | null {
            return document.actionAttempts
              .filter((item) => item.intentId === intentId)
              .sort((left, right) => right.dispatchNumber - left.dispatchNumber)[0] ?? null;
          }

          function receiptFor(document: AutomationDocument, actionAttemptId: string): ActionReceipt | null {
            return document.actionReceipts.find((item) => item.actionAttemptId === actionAttemptId) ?? null;
          }

          function requestExternal(document: AutomationDocument, actionAttempt: ActionAttempt): ExternalRef | null {
            if (!actionAttempt.providerRequestRef) return null;
            return document.externalRefs.find((item) => item.externalRefId === actionAttempt.providerRequestRef) ?? null;
          }

          function verificationEvidence(document: AutomationDocument, executionAttemptId: string): Evidence | null {
            return document.evidences.find((item) => item.type === STEP_VERIFICATION_EVIDENCE && item.attemptId === executionAttemptId && item.producer === STEP_VERIFIER_PROTOCOL) ?? null;
          }

          function result(input: {
            status: StepVerificationStatus;
            projectId: string;
            stageSpecId: string;
            stepSpecId: string;
            runtime: StepRuntime;
            executionAttemptId: string;
            planVersionId: string;
            verificationClass: PlannerVerificationClass | null;
            verificationEvidenceId?: string | null;
            expectedHash?: string | null;
            observedHash?: string | null;
            reason?: string | null;
          }): StepVerificationResult {
            return {
              status: input.status,
              projectId: input.projectId,
              stageSpecId: input.stageSpecId,
              stepSpecId: input.stepSpecId,
              stepRuntimeId: input.runtime.stepRuntimeId,
              executionAttemptId: input.executionAttemptId,
              planVersionId: input.planVersionId,
              verificationClass: input.verificationClass,
              verificationEvidenceId: input.verificationEvidenceId ?? null,
              expectedHash: input.expectedHash ?? null,
              observedHash: input.observedHash ?? null,
              reason: input.reason ?? null,
            };
          }

          /**
           * Deterministic workflow verifier over already-persisted truth only.
           *
           * It never opens a Native Turn, invokes a provider, executes shell text,
           * reads a transcript, or owns a sandbox. v1 auto-verifies HASH_MATCH by
           * comparing an immutable Plan policy to the successful Step receipt hash.
           * Other typed verifier classes remain fail-closed in VERIFYING until a
           * dedicated evidence adapter exists.
           */
          export class DeterministicStepVerificationService {
            readonly store: AutomationStore;

            constructor(options: { readonly store: AutomationStore }) {
              this.store = options.store;
            }

            async verify(input: VerifyStepInput): Promise<StepVerificationResult> {
              const document = await this.store.snapshot();
              const project = document.automationProjects.find((item) => item.projectId === input.projectId);
              if (!project) throw new StepVerificationError("STEP_VERIFICATION_PROJECT_NOT_FOUND", `AutomationProject was not found: ${input.projectId}`);
              const attempt = document.executionAttempts.find((item) => item.attemptId === input.executionAttemptId);
              if (!attempt || attempt.projectId !== input.projectId) {
                throw new StepVerificationError("STEP_VERIFICATION_ATTEMPT_NOT_FOUND", `ExecutionAttempt was not found for project: ${input.executionAttemptId}`);
              }
              const step = document.stepSpecs.find((item) => item.stepSpecId === attempt.stepSpecId);
              const stage = step ? document.stageSpecs.find((item) => item.stageSpecId === step.stageSpecId) : null;
              const plan = stage ? document.planVersions.find((item) => item.planVersionId === stage.planVersionId) : null;
              const runtime = document.stepRuntimes.find((item) => item.stepSpecId === attempt.stepSpecId);
              if (!step || !stage || !plan || !runtime || stage.stageSpecId !== attempt.stageSpecId || runtime.currentAttemptId !== attempt.attemptId) {
                throw new StepVerificationError("STEP_VERIFICATION_CORRELATION_MISMATCH", "ExecutionAttempt, StepRuntime, StepSpec, StageSpec, and PlanVersion identities do not correlate.");
              }
              if (plan.projectId !== input.projectId || plan.status !== "ACTIVE" || project.activePlanVersionId !== plan.planVersionId) {
                throw new StepVerificationError("STEP_VERIFICATION_PLAN_NOT_ACTIVE", "Verifier refuses to advance a Step from a non-active PlanVersion.");
              }

              const policyRead = readPolicy(plan, step);
              if (policyRead.status === "MISSING") {
                return result({ status: "POLICY_MISSING", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: null, reason: policyRead.reason });
              }
              if (policyRead.status === "INVALID") {
                return result({ status: "POLICY_INVALID", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policyRead.verificationClass, reason: policyRead.reason });
              }
              const policy = policyRead.policy;
              const fingerprint = policySha256(policy);
              const existing = verificationEvidence(document, attempt.attemptId);
              if (existing) {
                if (existing.metadata.policySha256 !== fingerprint || existing.metadata.planPayloadSha256 !== plan.payloadSha256) {
                  throw new StepVerificationError("STEP_VERIFICATION_CORRELATION_MISMATCH", "Existing Step verification Evidence is bound to a different immutable policy.");
                }
                const outcome = existing.metadata.outcome;
                const expectedHash = typeof existing.metadata.expectedHash === "string" ? existing.metadata.expectedHash : null;
                const observedHash = typeof existing.metadata.observedHash === "string" ? existing.metadata.observedHash : null;
                if (outcome === "PASS") {
                  if (runtime.lifecycle === "VERIFYING") {
                    await this.store.transitionStepRuntime(runtime.stepRuntimeId, "REVIEW", { actorType: "AUTOMATION", actorRef: STEP_VERIFIER_PROTOCOL, boundedPayload: { evidenceId: existing.evidenceId, verificationClass: policy.verificationClass, outcome: "PASS" }, correlationId: attempt.attemptId, causationId: existing.evidenceId });
                  } else if (runtime.lifecycle !== "REVIEWING") {
                    throw new StepVerificationError("STEP_VERIFICATION_CORRELATION_MISMATCH", "PASS Evidence does not match the current StepRuntime lifecycle.");
                  }
                  return result({ status: "REVIEWING", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, verificationEvidenceId: existing.evidenceId, expectedHash, observedHash });
                }
                if (outcome === "FAIL") {
                  if (runtime.lifecycle === "VERIFYING") {
                    await this.store.transitionStepRuntime(runtime.stepRuntimeId, "FAIL", { actorType: "AUTOMATION", actorRef: STEP_VERIFIER_PROTOCOL, boundedPayload: { evidenceId: existing.evidenceId, verificationClass: policy.verificationClass, outcome: "FAIL" }, correlationId: attempt.attemptId, causationId: existing.evidenceId });
                  } else if (runtime.lifecycle !== "TERMINAL" || runtime.terminalResult !== "FAILED") {
                    throw new StepVerificationError("STEP_VERIFICATION_CORRELATION_MISMATCH", "FAIL Evidence does not match the current StepRuntime lifecycle.");
                  }
                  return result({ status: "FAILED", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, verificationEvidenceId: existing.evidenceId, expectedHash, observedHash });
                }
                throw new StepVerificationError("STEP_VERIFICATION_CORRELATION_MISMATCH", "Existing Step verification Evidence has an unsupported outcome.");
              }

              if (runtime.lifecycle !== "VERIFYING") {
                throw new StepVerificationError("STEP_VERIFICATION_NOT_VERIFYING", `StepRuntime is not eligible for deterministic verification: ${runtime.lifecycle}.`);
              }
              if (attempt.lifecycle !== "COMPLETED" || attempt.terminalResult !== "COMPLETED") {
                return result({ status: "NOT_READY", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, reason: "ExecutionAttempt is not terminal-successful." });
              }
              if (policy.verificationClass !== "HASH_MATCH") {
                return result({ status: "UNSUPPORTED_CLASS", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, reason: `Verifier class ${policy.verificationClass} has no side-effect-free v1 evidence adapter.` });
              }
              if (policy.verificationPlan.length !== 1) {
                return result({ status: "POLICY_INVALID", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, reason: "HASH_MATCH requires exactly one result-sha256:<hash> instruction." });
              }
              const match = HASH_MATCH_PLAN.exec(policy.verificationPlan[0]!);
              if (!match) {
                return result({ status: "POLICY_INVALID", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, reason: "HASH_MATCH instructions are data, not executable text; expected result-sha256:<64 lowercase hex>." });
              }
              const expectedHash = match[1]!;
              const intent = actionForAttempt(document, attempt.attemptId);
              const actionAttempt = intent ? latestActionAttempt(document, intent.intentId) : null;
              const receipt = actionAttempt ? receiptFor(document, actionAttempt.actionAttemptId) : null;
              if (!intent || !actionAttempt || !receipt || receipt.status !== "SUCCEEDED" || receipt.outcomeCertainty !== "TERMINAL_CONFIRMED" || !receipt.resultHash || !SHA256.test(receipt.resultHash)) {
                return result({ status: "NOT_READY", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, expectedHash, reason: "No terminal-confirmed successful STEP_EXECUTION receipt hash is available." });
              }
              const observedHash = receipt.resultHash;
              const outcome = observedHash === expectedHash ? "PASS" as const : "FAIL" as const;
              const evidenceId = `step-verification:${sha256Hex(`${STEP_VERIFIER_PROTOCOL}\u0000${attempt.attemptId}\u0000${plan.payloadSha256}\u0000${fingerprint}`)}`;
              const external = requestExternal(document, actionAttempt);
              const evidence = await this.store.createEvidence({
                evidenceId,
                projectId: input.projectId,
                stageSpecId: stage.stageSpecId,
                stepSpecId: step.stepSpecId,
                attemptId: attempt.attemptId,
                type: STEP_VERIFICATION_EVIDENCE,
                source: STEP_VERIFICATION_SOURCE,
                producer: STEP_VERIFIER_PROTOCOL,
                exitCode: null,
                sha256: observedHash,
                artifactRefId: null,
                metadata: {
                  expectedHash,
                  observedHash,
                  outcome,
                  planPayloadSha256: plan.payloadSha256,
                  planVersionId: plan.planVersionId,
                  policySha256: fingerprint,
                  verificationClass: policy.verificationClass,
                  verifierProtocol: STEP_VERIFIER_PROTOCOL,
                },
                correlation: {
                  workflowActionId: intent.intentId,
                  requestId: null,
                  nativeThreadId: null,
                  nativeTurnId: external?.kind === "NATIVE_TURN" && external.provider === "NATIVE" ? external.opaqueId : null,
                  resourceLeaseId: null,
                  artifactRefs: [],
                  evidenceRefs: [],
                },
              });
              await this.store.transitionStepRuntime(runtime.stepRuntimeId, outcome === "PASS" ? "REVIEW" : "FAIL", {
                actorType: "AUTOMATION",
                actorRef: STEP_VERIFIER_PROTOCOL,
                boundedPayload: { evidenceId: evidence.evidenceId, verificationClass: policy.verificationClass, outcome },
                correlationId: attempt.attemptId,
                causationId: evidence.evidenceId,
              });
              return result({ status: outcome === "PASS" ? "REVIEWING" : "FAILED", projectId: input.projectId, stageSpecId: stage.stageSpecId, stepSpecId: step.stepSpecId, runtime, executionAttemptId: attempt.attemptId, planVersionId: plan.planVersionId, verificationClass: policy.verificationClass, verificationEvidenceId: evidence.evidenceId, expectedHash, observedHash });
            }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/automation-execution-facade.ts')
          text = path.read_text()
          replacements = [
            (
              'import type { ExecuteStepInput, ReconcileStepInput } from "../automation/step-execution-service.ts";\nimport { AutomationStore } from "../automation/store.ts";',
              'import type { ExecuteStepInput, ReconcileStepInput } from "../automation/step-execution-service.ts";\nimport { DeterministicStepVerificationService, type VerifyStepInput } from "../automation/step-verification-service.ts";\nimport { AutomationStore } from "../automation/store.ts";'
            ),
            (
              '  readonly store: AutomationStore;\n  readonly services: AutomationProviderServiceRouter;\n\n  constructor(options: { store: AutomationStore; services: AutomationProviderServiceRouter }) {\n    this.store = options.store;\n    this.services = options.services;\n  }',
              '  readonly store: AutomationStore;\n  readonly services: AutomationProviderServiceRouter;\n  readonly stepVerification: DeterministicStepVerificationService;\n\n  constructor(options: { store: AutomationStore; services: AutomationProviderServiceRouter }) {\n    this.store = options.store;\n    this.services = options.services;\n    this.stepVerification = new DeterministicStepVerificationService({ store: options.store });\n  }'
            ),
            (
              '  async reconcileStep(input: ReconcileStepInput, providerId?: AutomationProviderId | null) {\n    const provider = await this.providerForStepExecutionAttempt(input.executionAttemptId, providerId);\n    return this.services.stepExecution(provider).reconcile(input);\n  }\n\n  async providerForRequirementSession',
              '  async reconcileStep(input: ReconcileStepInput, providerId?: AutomationProviderId | null) {\n    const provider = await this.providerForStepExecutionAttempt(input.executionAttemptId, providerId);\n    return this.services.stepExecution(provider).reconcile(input);\n  }\n\n  async verifyStep(input: VerifyStepInput) {\n    return this.stepVerification.verify(input);\n  }\n\n  async providerForRequirementSession'
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'automation-execution-facade exact patch anchor mismatch: {old[:100]!r} count={text.count(old)}')
            text = text.replace(old, new)
          path.write_text(text)
          PY

          if grep -Eq 'from "\./adapters\.ts"|from "\.\./codex/|startTurn\(|\.submit\(' src/automation/step-verification-service.ts; then
            echo 'Step verifier must not import provider/runtime execution seams or dispatch work.' >&2
            exit 1
          fi
          git diff --check
          git diff -- src/automation/step-verification-service.ts src/main/automation-execution-facade.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Step verifier tests
        run: node --experimental-strip-types --test tests/automation-step-verifier.test.ts tests/automation-native-step-executor.test.ts tests/automation-step-verification-contract.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated verifier and self-clean workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/automation/step-verification-service.ts src/main/automation-execution-facade.ts
          git rm .github/workflows/automation-step-verifier.yml
          git commit -m 'feat: add deterministic Step verifier'
          git push origin HEAD:feature/automation-step-verifier
