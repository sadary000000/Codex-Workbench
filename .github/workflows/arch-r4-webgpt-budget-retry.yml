name: ARCH-R4 WebGPT Policy Budget Retry

on:
  push:
    branches:
      - arch-r4/webgpt-policy-budget-durability

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: "${{ github.event.head_commit.message == 'ARCH-R4: retry WebGPT policy budget durability patch' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded WebGPT policy durability patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after_unique(raw: bytes, anchor: bytes, addition: bytes, label: str) -> bytes:
              if raw.count(anchor) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {raw.count(anchor)}')
              return raw.replace(anchor, anchor + addition, 1)

          def insert_before_unique(raw: bytes, anchor: bytes, addition: bytes, label: str) -> bytes:
              if raw.count(anchor) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {raw.count(anchor)}')
              return raw.replace(anchor, addition + anchor, 1)

          policy_path = Path('src/automation/webgpt-policy-authority.ts')
          raw = policy_path.read_bytes()
          interface_anchor = b'  evaluatePinned(operation: PolicyOperation, correlationId: string, policyVersionId: string, runtimeCapability: RuntimeCapability, scopeProjectId?: string | null): Promise<EffectivePolicyDecision>;'
          raw = insert_after_unique(raw, interface_anchor, b'\n  /** Persist the committed dispatch budget immediately before the browser/provider mutation. */\n  commit?(admission: WebGptPolicyAdmission): Promise<void>;', 'policy interface')
          field_anchor = b'  private readonly budgets = new Map<string, PolicyBudgetAuthority>();'
          raw = insert_after_unique(raw, field_anchor, b'\n  private readonly committedAdmissions = new WeakSet<object>();', 'policy fields')
          snapshot_anchor = b'  snapshot(policyVersionId = WEBGPT_RUNTIME_POLICY_VERSION_ID): ReturnType<PolicyBudgetAuthority["snapshot"]> | null {'
          commit_method = b'''  async commit(admission: WebGptPolicyAdmission): Promise<void> {\n    if (this.committedAdmissions.has(admission)) return;\n    const effectivePolicy = admission.decision.effectivePolicy;\n    const correlationId = admission.pin.correlationId;\n    const limit = effectivePolicy.budgets[admission.operation];\n    if (admission.policyVersionId !== effectivePolicy.policyVersionId || admission.pin.policyVersionId !== effectivePolicy.policyVersionId) {\n      admission.reservation.release();\n      throw new WebGptPolicyAuthorityError("POLICY_PIN_MISMATCH", "WebGPT budget commit no longer matches the admitted PolicyVersion; browser mutation refused.", { policyVersionId: admission.policyVersionId, effectivePolicyVersionId: effectivePolicy.policyVersionId });\n    }\n    try {\n      await this.store.transaction((tx) => {\n        const committed = tx.table("auditEvents").filter((event) =>\n          event.projectId === effectivePolicy.projectId\n          && event.entityType === "PolicyVersion"\n          && event.entityId === effectivePolicy.policyVersionId\n          && event.eventType === "POLICY_BUDGET_COMMITTED"\n          && event.boundedPayload.budgetKind === admission.operation,\n        );\n        if (committed.some((event) => event.correlationId === correlationId)) {\n          throw new WebGptPolicyAuthorityError("POLICY_BUDGET_DENIED", `WebGPT ${admission.operation} budget correlation was already committed.`, { policyVersionId: effectivePolicy.policyVersionId, operation: admission.operation, correlationId, remaining: Math.max(0, limit - committed.length) });\n        }\n        if (committed.length >= limit) {\n          throw new WebGptPolicyAuthorityError("POLICY_BUDGET_EXHAUSTED", `WebGPT ${admission.operation} budget is exhausted for the pinned PolicyVersion.`, { policyVersionId: effectivePolicy.policyVersionId, operation: admission.operation, correlationId, remaining: 0 });\n        }\n        tx.appendAudit({ projectId: effectivePolicy.projectId, entityType: "PolicyVersion", entityId: effectivePolicy.policyVersionId, eventType: "POLICY_BUDGET_COMMITTED", actorType: "AUTOMATION", actorRef: null, boundedPayload: { budgetKind: admission.operation, effectiveBudget: limit }, correlationId, causationId: null });\n      });\n    } catch (error) {\n      admission.reservation.release();\n      throw error;\n    }\n    admission.reservation.commit();\n    this.committedAdmissions.add(admission);\n  }\n\n'''
          raw = insert_before_unique(raw, snapshot_anchor, commit_method, 'policy commit method')
          policy_path.write_bytes(raw)

          manager_path = Path('src/features/webgpt/runtime/webgpt-request-manager.ts')
          raw = manager_path.read_bytes()
          replacements = [
              (b'        newChatAdmission?.reservation.commit();', b'        await this.commitPolicy(newChatAdmission);', 'request NEW_CHAT commit'),
              (b'      promptAdmission?.reservation.commit();', b'      await this.commitPolicy(promptAdmission);', 'request PROMPT commit'),
              (b'    admission?.reservation.commit();', b'    await this.commitPolicy(admission);', 'control-plane dispatch commit'),
          ]
          for old, new, label in replacements:
              if raw.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {raw.count(old)}')
              raw = raw.replace(old, new, 1)
          dispatch_anchor = b'  private async dispatchWithPolicy<T>(admission: WebGptPolicyAdmission | null, dispatch: () => Promise<T>): Promise<T> {'
          helper = b'''  private async commitPolicy(admission: WebGptPolicyAdmission | null): Promise<void> {\n    if (!admission) return;\n    if (this.policyAuthority?.commit) {\n      await this.policyAuthority.commit(admission);\n      return;\n    }\n    if (this.requirePolicyAuthority) {\n      admission.reservation.release();\n      throw this.codedError("POLICY_DURABLE_COMMIT_REQUIRED", "Production WebGPT policy authority cannot persist the committed dispatch budget; browser mutation refused.");\n    }\n    admission.reservation.commit();\n  }\n\n'''
          raw = insert_before_unique(raw, dispatch_anchor, helper, 'RequestManager commit helper')
          manager_path.write_bytes(raw)
          PY

      - name: Enforce bounded source diff
        shell: bash
        run: |
          git diff --check
          git diff --numstat -- src/automation/webgpt-policy-authority.ts src/features/webgpt/runtime/webgpt-request-manager.ts
          changed=$(git diff --numstat -- src/automation/webgpt-policy-authority.ts src/features/webgpt/runtime/webgpt-request-manager.ts | awk '{sum += $1+$2} END {print sum}')
          test "${changed:-999}" -le 95
          git diff -- src/automation/webgpt-policy-authority.ts | grep -F 'POLICY_BUDGET_COMMITTED' >/dev/null
          git diff -- src/features/webgpt/runtime/webgpt-request-manager.ts | grep -F 'POLICY_DURABLE_COMMIT_REQUIRED' >/dev/null

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: R4 WebGPT restart regression
        run: node --experimental-strip-types --test tests/arch-r4-webgpt-policy-budget-durability.test.ts
      - name: Existing policy consumer regressions
        run: node --experimental-strip-types --test tests/arch-v2-5-production-consumers.test.ts tests/webgpt-request-manager.test.ts
      - name: Full unit and integration suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/automation/webgpt-policy-authority.ts src/features/webgpt/runtime/webgpt-request-manager.ts
          git commit -m 'ARCH-R4: persist WebGPT policy budget commitments'
          git push origin HEAD:arch-r4/webgpt-policy-budget-durability
