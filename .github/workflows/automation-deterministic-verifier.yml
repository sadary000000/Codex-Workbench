name: Automation Deterministic Verifier Gate

on:
  push:
    branches:
      - feature/automation-deterministic-verifier

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff guard
        shell: bash
        run: |
          set -euo pipefail
          base='f26e9700525e4095541e206016d77a7f6caaf2f4'
          allowed='^(src/automation/deterministic-verifier\.ts|src/main/automation-execution-facade\.ts|tests/automation-deterministic-verifier\.test\.ts|\.github/workflows/automation-deterministic-verifier\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded deterministic verifier slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in src/automation/deterministic-verifier.ts tests/automation-deterministic-verifier.test.ts .github/workflows/automation-deterministic-verifier.yml; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required initial diff: $required" >&2; exit 1; }
          done

      - name: Apply exact facade verifier wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/automation-execution-facade.ts')
          text = path.read_text()
          replacements = [
            (
              'import { AutomationProviderServiceRouter } from "../automation/provider-service-router.ts";\nimport type { ExecuteStepInput, ReconcileStepInput } from "../automation/step-execution-service.ts";',
              'import { AutomationProviderServiceRouter } from "../automation/provider-service-router.ts";\nimport { DeterministicStepVerifier, type VerifyStepInput } from "../automation/deterministic-verifier.ts";\nimport type { ExecuteStepInput, ReconcileStepInput } from "../automation/step-execution-service.ts";'
            ),
            (
              '  readonly store: AutomationStore;\n  readonly services: AutomationProviderServiceRouter;\n\n  constructor(options: { store: AutomationStore; services: AutomationProviderServiceRouter }) {\n    this.store = options.store;\n    this.services = options.services;\n  }',
              '  readonly store: AutomationStore;\n  readonly services: AutomationProviderServiceRouter;\n  readonly verifier: DeterministicStepVerifier;\n\n  constructor(options: { store: AutomationStore; services: AutomationProviderServiceRouter }) {\n    this.store = options.store;\n    this.services = options.services;\n    this.verifier = new DeterministicStepVerifier(options.store);\n  }'
            ),
            (
              '  async reconcileStep(input: ReconcileStepInput, providerId?: AutomationProviderId | null) {\n    const provider = await this.providerForStepExecutionAttempt(input.executionAttemptId, providerId);\n    return this.services.stepExecution(provider).reconcile(input);\n  }\n\n  async providerForRequirementSession',
              '  async reconcileStep(input: ReconcileStepInput, providerId?: AutomationProviderId | null) {\n    const provider = await this.providerForStepExecutionAttempt(input.executionAttemptId, providerId);\n    return this.services.stepExecution(provider).reconcile(input);\n  }\n\n  async verifyStep(input: VerifyStepInput) {\n    return this.verifier.verify(input);\n  }\n\n  async providerForRequirementSession'
            ),
          ]
          for old, new in replacements:
            if text.count(old) != 1:
              raise SystemExit(f'facade exact patch anchor mismatch: {old[:100]!r} count={text.count(old)}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- src/main/automation-execution-facade.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted deterministic verifier tests
        run: node --experimental-strip-types --test tests/automation-deterministic-verifier.test.ts tests/automation-step-verification-contract.test.ts tests/automation-native-step-executor.test.ts tests/automation-execution-verification-boundary.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated facade wiring and self-clean workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/automation-execution-facade.ts
          git rm .github/workflows/automation-deterministic-verifier.yml
          git commit -m 'feat: expose deterministic Step verifier'
          git push origin HEAD:feature/automation-deterministic-verifier
