          Path("tests/requirement-deterministic-repair.test.ts").write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import { createDeterministicRequirementRepairCandidate } from "../src/automation/requirement-response-repair.ts";
import {
  parseRequirementSemanticResponse,
  tryParseRequirementResponse,
  type RequirementEnvelopeContext,
} from "../src/automation/requirement-webgpt-contract.ts";

const context: RequirementEnvelopeContext = {
  projectId: "project-repair-test",
  requestId: "request-repair-test",
  idempotencyKey: "idempotency-repair-test",
  semanticSha256: "1".repeat(64),
  role: "REQUIREMENT",
};

const valid = JSON.stringify({
  requirementProtocolVersion: 1,
  status: "READY_FOR_DRAFT",
  payload: {
    draft: {
      goal: "创建一个可以直接运行的经典贪吃蛇小游戏。",
      constraints: ["不依赖外部服务。"],
      acceptanceCriteria: ["方向键可以控制蛇移动。"],
      nonGoals: ["不实现复杂视觉效果、音效或其他扩展玩法。"],
    },
  },
});

test("repairs only a completed Requirement JSON object missing its final root brace", () => {
  const truncated = valid.slice(0, -1);
  const repairResponse = createDeterministicRequirementRepairCandidate(truncated);
  assert.equal(repairResponse, valid);
  const result = tryParseRequirementResponse(truncated, context, { repairBudget: 1, repairResponse: repairResponse! });
  assert.equal(result.ok, true);
  if (result.ok) {
    assert.equal(result.source, "repair");
    assert.equal(result.repairAttempts, 1);
    assert.equal(result.envelope.status, "READY_FOR_DRAFT");
  }
});

test("deterministic Requirement repair stays fail-closed for every wider malformed shape", () => {
  const cases = [
    valid,
    valid.slice(0, -2),
    `${valid.slice(0, -1)} trailing`,
    `prefix ${valid.slice(0, -1)}`,
    `\`\`\`json\n${valid.slice(0, -1)}\n\`\`\``,
    '{"requirementProtocolVersion":1,"status":"READY_FOR_DRAFT","payload":{"draft":{"goal":"unterminated}}',
    '{"requirementProtocolVersion":1,"status":"READY_FOR_DRAFT","payload":{"draft":{"goal":"x"}],',
    '{"requirementProtocolVersion":1,"status":"READY_FOR_DRAFT","payload":{"draft":{"goal":"x"}},',
  ];
  for (const malformed of cases) assert.equal(createDeterministicRequirementRepairCandidate(malformed), null, malformed);
});

test("a locally repaired candidate still must pass the unchanged Requirement schema and semantics", () => {
  const invalidSemantic = JSON.stringify({
    requirementProtocolVersion: 1,
    status: "READY_FOR_DRAFT",
    payload: { draft: { goal: "valid goal", unexpected: true } },
  });
  const truncated = invalidSemantic.slice(0, -1);
  const repairResponse = createDeterministicRequirementRepairCandidate(truncated);
  assert.ok(repairResponse);
  assert.throws(() => parseRequirementSemanticResponse(repairResponse!));
  const result = tryParseRequirementResponse(truncated, context, { repairBudget: 1, repairResponse: repairResponse! });
  assert.equal(result.ok, false);
  if (!result.ok) {
    assert.equal(result.source, "repair");
    assert.equal(result.repairAttempts, 1);
    assert.equal(result.error.code, "REPAIR_FAILED");
  }
});
''', encoding="utf-8")

          provider_marker = 'test("AUT-R0 persists the round ActionAttempt before the provider side effect", async () => {\n'
          provider_tests = r'''test("AUT-R0 repairs one missing final Requirement root brace without another provider dispatch", async () => {
  const value = await fixture();
  const provider = new FakeProvider();
  provider.response = provider.response.slice(0, -1);
  try {
    const service = new RequirementAutomationService({ store: value.store, provider, inputRefs: new InputRefRegistry() });
    const session = await service.startAlignment({ projectId: "aut-r0-automation", goal: "Accept one deterministic provider truncation.", webgptProjectId: "workts", providerTargetRef: TEST_TARGET, questions: [] });
    const result = await service.requestDraft({ sessionId: session.alignmentSessionId, providerTargetRef: TEST_TARGET });
    assert.equal(result.status, "DRAFT_READY");
    assert.equal(provider.submitted.length, 1);
    const snapshot = await value.store.snapshot();
    assert.equal(snapshot.actionAttempts.length, 1, "local repair must not create another provider attempt");
  } finally {
    await closeFixture(value);
  }
});

test("AUT-R0 applies the same bounded local repair when reconciling a completed Requirement turn", async () => {
  const value = await fixture();
  const provider = new FakeProvider();
  provider.state = "RUNNING";
  provider.response = provider.response.slice(0, -1);
  try {
    const service = new RequirementAutomationService({ store: value.store, provider, inputRefs: new InputRefRegistry() });
    const session = await service.startAlignment({ projectId: "aut-r0-automation", goal: "Reconcile one deterministic provider truncation.", webgptProjectId: "workts", providerTargetRef: TEST_TARGET, questions: [] });
    await assert.rejects(service.requestDraft({ sessionId: session.alignmentSessionId, providerTargetRef: TEST_TARGET }), (error: unknown) => error instanceof RequirementServiceError && error.code === "RECOVERY_REQUIRED");
    provider.state = "COMPLETED";
    const result = await service.reconcileProviderRequest({ sessionId: session.alignmentSessionId });
    assert.equal(result.status, "DRAFT_READY");
    assert.equal(provider.submitted.length, 1, "reconcile must read the accepted turn rather than resend it");
    const snapshot = await value.store.snapshot();
    assert.equal(snapshot.actionAttempts.length, 1, "local repair during reconcile must not create another provider attempt");
  } finally {
    await closeFixture(value);
  }
});

