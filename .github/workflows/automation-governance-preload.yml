name: Automation governance preload gate

on:
  push:
    branches:
      - feature/automation-governance-preload

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bounded preload bridge patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          channels = [
              '  automationStepExecute: "automation:step:execute",',
              '  automationStepReconcile: "automation:step:reconcile",',
              '  automationStepVerify: "automation:step:verify",',
              '  automationStepReview: "automation:step:review",',
              '  automationStageGate: "automation:stage:gate",',
              '  automationStageAdvance: "automation:stage:advance",',
              '  automationProjectComplete: "automation:project:complete",',
          ]

          main = "src/main/main.ts"
          replace_once(
              main,
              '  projectAutomationUnlink: "persistence:project-automation-associations:unlink",\n  threadList:',
              '  projectAutomationUnlink: "persistence:project-automation-associations:unlink",\n' + "\n".join(channels) + '\n  threadList:',
          )

          main_handlers = [
              '  ipcMain.handle(IPC.automationStepExecute, async (_event, projectId: unknown, stepSpecId: unknown, providerTargetRef: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256 || typeof stepSpecId !== "string" || !stepSpecId.trim() || stepSpecId.length > 256) throw codedError("STEP_EXECUTION_INPUT_REQUIRED", "Automation Step execution requires bounded Project and Step IDs.");',
              '      if (typeof providerTargetRef !== "string" || !providerTargetRef.trim() || providerTargetRef.length > 512 || /^https?:\\/\\//i.test(providerTargetRef.trim())) throw codedError("STEP_EXECUTION_INPUT_REQUIRED", "Automation Step execution requires a bounded opaque provider target reference.");',
              '      return ok(await getAutomationProviderHost().execution.executeStep({ projectId: projectId.trim(), stepSpecId: stepSpecId.trim(), providerTargetRef: providerTargetRef.trim() }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
              '  ipcMain.handle(IPC.automationStepReconcile, async (_event, projectId: unknown, executionAttemptId: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256 || typeof executionAttemptId !== "string" || !executionAttemptId.trim() || executionAttemptId.length > 256) throw codedError("STEP_ATTEMPT_REQUIRED", "Automation Step reconciliation requires bounded Project and ExecutionAttempt IDs.");',
              '      return ok(await getAutomationProviderHost().execution.reconcileStep({ projectId: projectId.trim(), executionAttemptId: executionAttemptId.trim() }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
              '  ipcMain.handle(IPC.automationStepVerify, async (_event, projectId: unknown, executionAttemptId: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256 || typeof executionAttemptId !== "string" || !executionAttemptId.trim() || executionAttemptId.length > 256) throw codedError("STEP_ATTEMPT_REQUIRED", "Automation Step verification requires bounded Project and ExecutionAttempt IDs.");',
              '      return ok(await getAutomationProviderHost().execution.verifyStep({ projectId: projectId.trim(), executionAttemptId: executionAttemptId.trim() }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
              '  ipcMain.handle(IPC.automationStepReview, async (_event, projectId: unknown, executionAttemptId: unknown, decision: unknown, reviewerRef: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256 || typeof executionAttemptId !== "string" || !executionAttemptId.trim() || executionAttemptId.length > 256) throw codedError("STEP_REVIEW_INPUT_REQUIRED", "Automation Step review requires bounded Project and ExecutionAttempt IDs.");',
              '      if (decision !== "APPROVE" && decision !== "REJECT") throw codedError("STEP_REVIEW_DECISION_INVALID", "Automation Step review decision must be APPROVE or REJECT.");',
              '      if (reviewerRef !== undefined && (typeof reviewerRef !== "string" || !reviewerRef.trim() || reviewerRef.length > 256)) throw codedError("STEP_REVIEW_INPUT_REQUIRED", "Automation Step reviewerRef must be a bounded provenance reference.");',
              '      return ok(await getAutomationProviderHost().execution.reviewStep({ projectId: projectId.trim(), executionAttemptId: executionAttemptId.trim(), decision, ...(typeof reviewerRef === "string" ? { reviewerRef: reviewerRef.trim() } : {}) }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
              '  ipcMain.handle(IPC.automationStageGate, async (_event, projectId: unknown, stageSpecId: unknown, decision: unknown, gatekeeperRef: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256 || typeof stageSpecId !== "string" || !stageSpecId.trim() || stageSpecId.length > 256) throw codedError("STAGE_GATE_INPUT_REQUIRED", "Automation Stage gate requires bounded Project and Stage IDs.");',
              '      if (decision !== "PASS" && decision !== "REJECT") throw codedError("STAGE_GATE_DECISION_INVALID", "Automation Stage gate decision must be PASS or REJECT.");',
              '      if (gatekeeperRef !== undefined && (typeof gatekeeperRef !== "string" || !gatekeeperRef.trim() || gatekeeperRef.length > 256)) throw codedError("STAGE_GATE_INPUT_REQUIRED", "Automation Stage gatekeeperRef must be a bounded provenance reference.");',
              '      return ok(await getAutomationProviderHost().execution.gateStage({ projectId: projectId.trim(), stageSpecId: stageSpecId.trim(), decision, ...(typeof gatekeeperRef === "string" ? { gatekeeperRef: gatekeeperRef.trim() } : {}) }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
              '  ipcMain.handle(IPC.automationStageAdvance, async (_event, projectId: unknown, stageSpecId: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256 || typeof stageSpecId !== "string" || !stageSpecId.trim() || stageSpecId.length > 256) throw codedError("STAGE_ADVANCE_INPUT_REQUIRED", "Automation Stage advance requires bounded Project and Stage IDs.");',
              '      return ok(await getAutomationProviderHost().execution.advanceStage({ projectId: projectId.trim(), stageSpecId: stageSpecId.trim() }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
              '  ipcMain.handle(IPC.automationProjectComplete, async (_event, projectId: unknown) => {',
              '    try {',
              '      if (typeof projectId !== "string" || !projectId.trim() || projectId.length > 256) throw codedError("PROJECT_COMPLETION_INPUT_REQUIRED", "Automation Project completion requires a bounded Project ID.");',
              '      return ok(await getAutomationProviderHost().execution.completeProject({ projectId: projectId.trim() }));',
              '    } catch (error) {',
              '      return fail(error);',
              '    }',
              '  });',
          ]
          replace_once(
              main,
              '  ipcMain.handle(IPC.threadList, async (_event, projectId: unknown) => {',
              "\n".join(main_handlers) + '\n  ipcMain.handle(IPC.threadList, async (_event, projectId: unknown) => {',
          )

          preload = "src/preload/preload.cts"
          replace_once(
              preload,
              '  projectAutomationUnlink: "persistence:project-automation-associations:unlink",\n  threadList:',
              '  projectAutomationUnlink: "persistence:project-automation-associations:unlink",\n' + "\n".join(channels) + '\n  threadList:',
          )
          preload_methods = [
              '  executeAutomationStep: (projectId: string, stepSpecId: string, providerTargetRef: string) => ipcRenderer.invoke(channels.automationStepExecute, String(projectId ?? "").slice(0, 256), String(stepSpecId ?? "").slice(0, 256), String(providerTargetRef ?? "").slice(0, 512)),',
              '  reconcileAutomationStep: (projectId: string, executionAttemptId: string) => ipcRenderer.invoke(channels.automationStepReconcile, String(projectId ?? "").slice(0, 256), String(executionAttemptId ?? "").slice(0, 256)),',
              '  verifyAutomationStep: (projectId: string, executionAttemptId: string) => ipcRenderer.invoke(channels.automationStepVerify, String(projectId ?? "").slice(0, 256), String(executionAttemptId ?? "").slice(0, 256)),',
              '  reviewAutomationStep: (projectId: string, executionAttemptId: string, decision: string, reviewerRef?: string | null) => ipcRenderer.invoke(channels.automationStepReview, String(projectId ?? "").slice(0, 256), String(executionAttemptId ?? "").slice(0, 256), String(decision ?? "").slice(0, 16), reviewerRef == null ? undefined : String(reviewerRef).slice(0, 256)),',
              '  gateAutomationStage: (projectId: string, stageSpecId: string, decision: string, gatekeeperRef?: string | null) => ipcRenderer.invoke(channels.automationStageGate, String(projectId ?? "").slice(0, 256), String(stageSpecId ?? "").slice(0, 256), String(decision ?? "").slice(0, 16), gatekeeperRef == null ? undefined : String(gatekeeperRef).slice(0, 256)),',
              '  advanceAutomationStage: (projectId: string, stageSpecId: string) => ipcRenderer.invoke(channels.automationStageAdvance, String(projectId ?? "").slice(0, 256), String(stageSpecId ?? "").slice(0, 256)),',
              '  completeAutomationProject: (projectId: string) => ipcRenderer.invoke(channels.automationProjectComplete, String(projectId ?? "").slice(0, 256)),',
          ]
          replace_once(
              preload,
              '  unlinkAutomationProject: (productProjectId: string, automationProjectId: string) => ipcRenderer.invoke(channels.projectAutomationUnlink, String(productProjectId ?? "").slice(0, 256), String(automationProjectId ?? "").slice(0, 256)),\n  listThreads:',
              '  unlinkAutomationProject: (productProjectId: string, automationProjectId: string) => ipcRenderer.invoke(channels.projectAutomationUnlink, String(productProjectId ?? "").slice(0, 256), String(automationProjectId ?? "").slice(0, 256)),\n' + "\n".join(preload_methods) + '\n  listThreads:',
          )

          renderer = "src/renderer/renderer.ts"
          renderer_methods = [
              '  executeAutomationStep(projectId: string, stepSpecId: string, providerTargetRef: string): Promise<IpcEnvelope<unknown>>;',
              '  reconcileAutomationStep(projectId: string, executionAttemptId: string): Promise<IpcEnvelope<unknown>>;',
              '  verifyAutomationStep(projectId: string, executionAttemptId: string): Promise<IpcEnvelope<unknown>>;',
              '  reviewAutomationStep(projectId: string, executionAttemptId: string, decision: "APPROVE" | "REJECT", reviewerRef?: string | null): Promise<IpcEnvelope<unknown>>;',
              '  gateAutomationStage(projectId: string, stageSpecId: string, decision: "PASS" | "REJECT", gatekeeperRef?: string | null): Promise<IpcEnvelope<unknown>>;',
              '  advanceAutomationStage(projectId: string, stageSpecId: string): Promise<IpcEnvelope<unknown>>;',
              '  completeAutomationProject(projectId: string): Promise<IpcEnvelope<unknown>>;',
          ]
          replace_once(
              renderer,
              '  unlinkAutomationProject(productProjectId: string, automationProjectId: string): Promise<IpcEnvelope<ProjectAutomationAssociation>>;\n  listThreads',
              '  unlinkAutomationProject(productProjectId: string, automationProjectId: string): Promise<IpcEnvelope<ProjectAutomationAssociation>>;\n' + "\n".join(renderer_methods) + '\n  listThreads',
          )
          PY
          cat > tests/automation-governance-preload-bridge.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          test("Automation governance renderer bridge is a narrow Electron IPC allowlist", async () => {
            const [main, preload, renderer] = await Promise.all([
              readFile(new URL("../src/main/main.ts", import.meta.url), "utf8"),
              readFile(new URL("../src/preload/preload.cts", import.meta.url), "utf8"),
              readFile(new URL("../src/renderer/renderer.ts", import.meta.url), "utf8"),
            ]);
            const channels = [
              ["automationStepExecute", "automation:step:execute", "executeAutomationStep", "executeStep"],
              ["automationStepReconcile", "automation:step:reconcile", "reconcileAutomationStep", "reconcileStep"],
              ["automationStepVerify", "automation:step:verify", "verifyAutomationStep", "verifyStep"],
              ["automationStepReview", "automation:step:review", "reviewAutomationStep", "reviewStep"],
              ["automationStageGate", "automation:stage:gate", "gateAutomationStage", "gateStage"],
              ["automationStageAdvance", "automation:stage:advance", "advanceAutomationStage", "advanceStage"],
              ["automationProjectComplete", "automation:project:complete", "completeAutomationProject", "completeProject"],
            ] as const;
            for (const [key, channel, method, facadeMethod] of channels) {
              assert.match(main, new RegExp(`${key}: "${channel.replaceAll(":", "\\:")}"`));
              assert.match(preload, new RegExp(`${key}: "${channel.replaceAll(":", "\\:")}"`));
              assert.match(preload, new RegExp(`${method}:`));
              assert.match(renderer, new RegExp(`${method}\\(`));
              assert.match(main, new RegExp(`IPC\\.${key}`));
              assert.match(main, new RegExp(`getAutomationProviderHost\\(\\)\\.execution\\.${facadeMethod}\\(`));
            }
            assert.doesNotMatch(preload, /automation:governance:invoke/);
            assert.doesNotMatch(preload, /authToken|controlDescriptor|control-plane\.json/i);
            assert.doesNotMatch(preload, /providerId/);
          });

          test("Automation governance IPC validates decisions and keeps provenance non-authoritative", async () => {
            const main = await readFile(new URL("../src/main/main.ts", import.meta.url), "utf8");
            assert.match(main, /decision !== "APPROVE" && decision !== "REJECT"/);
            assert.match(main, /decision !== "PASS" && decision !== "REJECT"/);
            assert.match(main, /reviewerRef !== undefined/);
            assert.match(main, /gatekeeperRef !== undefined/);
            assert.doesNotMatch(main, /reviewerRef[^\n]{0,160}(authorize|permission|role)/i);
            assert.doesNotMatch(main, /gatekeeperRef[^\n]{0,160}(authorize|permission|role)/i);
          });
          EOF
      - name: Bounded diff guard
        shell: bash
        run: |
          allowed='^(.github/workflows/automation-governance-preload.yml|src/main/main.ts|src/preload/preload.cts|src/renderer/renderer.ts|tests/automation-governance-preload-bridge.test.ts)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          ! git diff | grep -E '^\+.*(new NativeThreadRuntime|new AppServerProcessClient|createAutomationExecutionFacade|createAutomationProviderHost\(|authToken|controlDescriptor|CREATE TABLE|ALTER TABLE)'
          grep -q 'automationStepExecute' src/preload/preload.cts
          grep -q 'IPC.automationProjectComplete' src/main/main.ts
          grep -q 'completeAutomationProject' src/renderer/renderer.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Focused bridge and governance tests
        run: node --experimental-strip-types --test tests/automation-governance-preload-bridge.test.ts tests/automation-governance-control-plane.test.ts tests/automation-governance-control-plane-dispatch.test.ts tests/arch-r2-automation-control-plane.test.ts tests/automation-native-step-executor.test.ts tests/automation-step-review-completion.test.ts tests/automation-stage-gate.test.ts tests/automation-stage-progression.test.ts tests/automation-project-completion.test.ts
      - name: Full repository tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit bounded patch and self-clean
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/automation-governance-preload.yml
          git add src/main/main.ts src/preload/preload.cts src/renderer/renderer.ts tests/automation-governance-preload-bridge.test.ts
          git diff --cached --name-only | grep -Ev '^(src/main/main.ts|src/preload/preload.cts|src/renderer/renderer.ts|tests/automation-governance-preload-bridge.test.ts|.github/workflows/automation-governance-preload.yml)$' && exit 1 || true
          git commit -m "Automation: expose governance preload bridge"
          git push origin HEAD:feature/automation-governance-preload
