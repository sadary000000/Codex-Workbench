name: Automation Step Review Completion Gate

on:
  push:
    branches:
      - feature/automation-step-review-completion

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Bounded diff and review provenance guard
        shell: bash
        run: |
          set -euo pipefail
          base='a140d4d14abd9f451a7a10d567a16b01be883f5f'
          allowed='^(src/automation/step-review-service\.ts|src/main/automation-execution-facade\.ts|tests/automation-step-review-completion\.test\.ts|\.github/workflows/automation-step-review-completion\.yml)$'
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"
          unexpected="$(printf '%s\n' "$files" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files in bounded Step review completion slice:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for required in src/automation/step-review-service.ts src/main/automation-execution-facade.ts tests/automation-step-review-completion.test.ts .github/workflows/automation-step-review-completion.yml; do
            printf '%s\n' "$files" | grep -Fx "$required" >/dev/null || { echo "Missing required review diff: $required" >&2; exit 1; }
          done
          if grep -Eq 'from "\./(adapters|effective-policy|provider-policy-authority|provider-service-router)\.ts"|from "\.\./.*codex/|REQUIRE_HUMAN_GATE|startTurn\(|\.submit\(|child_process|spawn\(|exec\(' src/automation/step-review-service.ts; then
            echo 'Step review must remain workflow-truth-only and must not reuse provider gate/runtime/executor seams.' >&2
            exit 1
          fi
          grep -F 'item.source === "WORKFLOW_TRUTH"' src/automation/step-review-service.ts >/dev/null
          grep -F 'item.metadata.verifierProtocol === STEP_VERIFIER_PROTOCOL' src/automation/step-review-service.ts >/dev/null
          grep -F 'actorType: "USER"' src/automation/step-review-service.ts >/dev/null
          grep -F 'evidenceRefs: [verification.evidenceId]' src/automation/step-review-service.ts >/dev/null
          grep -F 'review rejects PASS Evidence without exact verifier provenance' tests/automation-step-review-completion.test.ts >/dev/null
          git diff --check "$base"...HEAD

      - name: Typecheck
        run: npm run typecheck

      - name: Targeted Step governance chain tests
        run: node --experimental-strip-types --test tests/automation-step-review-completion.test.ts tests/automation-step-verifier.test.ts tests/automation-native-step-executor.test.ts tests/automation-step-verification-contract.test.ts

      - name: Full repository tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Self-clean validation workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/automation-step-review-completion.yml
          git commit -m 'test: remove Step review provenance gate'
          git push origin HEAD:feature/automation-step-review-completion
